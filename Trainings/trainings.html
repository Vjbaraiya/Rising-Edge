    <style>
      .validity-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.625rem;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: var(--radius-full);
        white-space: nowrap;
      }
      .validity-ok {
        background: rgba(16, 185, 129, 0.12);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .validity-warn {
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .validity-low {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .price-strike {
        text-decoration: line-through;
        color: var(--text-muted);
        font-size: 0.75rem;
        margin-right: 4px;
      }
      .price-sell {
        font-weight: 700;
        color: var(--text-main);
      }
      .pct-off {
        font-size: 0.6rem;
        font-weight: 700;
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-radius: var(--radius-full);
        padding: 1px 6px;
      }

      /* Payment modal — centered overlay */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: var(--sp-4);
      }
      .modal-backdrop.open {
        display: flex !important;
      }
      .nc-modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-2xl);
        padding: var(--sp-8);
        width: 100%;
        max-width: 460px;
        position: relative;
        animation: modalSlideIn 0.22s ease;
      }
      @keyframes modalSlideIn {
        from {
          transform: translateY(14px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .nc-modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: var(--sp-5);
      }
      .nc-modal-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-base);
      }
      .nc-modal-sub {
        font-size: 0.8rem;
        color: var(--text-sub);
      }
      .nc-modal-body {
        display: flex;
        flex-direction: column;
      }
      .nc-close {
        flex-shrink: 0;
        background: var(--bg-muted);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-sub);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nc-close:hover {
        background: var(--bg-hover);
        color: var(--text-base);
      }
      .pay-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--sp-2);
        font-size: 0.875rem;
      }
      .pay-row:last-child {
        margin-bottom: 0;
      }
      .pay-total-row {
        font-weight: 700;
        font-size: 1rem;
        border-top: 1px solid var(--border);
        padding-top: var(--sp-3);
        margin-top: var(--sp-3);
      }

      /* ── View switcher (Grid / List / Detail) ── */
      .view-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .view-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 34px;
        background: var(--bg-card);
        border: none;
        border-right: 1px solid var(--border);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .view-btn:last-child {
        border-right: none;
      }
      .view-btn:hover {
        background: var(--bg-hover);
        color: var(--text-base);
      }
      .view-btn.active {
        background: rgba(37, 99, 235, 0.12);
        color: var(--primary-400);
      }

      /* Detail view stacks cards in a single column and lays each card out
         horizontally (larger image left, full body right). Reuses the same
         card markup the grid renders — no separate markup needed. */
      #course-grid.tv-detail {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }
      #course-grid.tv-detail .training-card {
        display: flex;
        flex-direction: row;
        align-items: stretch;
      }
      #course-grid.tv-detail .training-card-image {
        width: 260px;
        min-height: 0;
        flex-shrink: 0;
      }
      #course-grid.tv-detail .training-card-body {
        flex: 1;
        min-width: 0;
      }
      @media (max-width: 640px) {
        #course-grid.tv-detail .training-card {
          flex-direction: column;
        }
        #course-grid.tv-detail .training-card-image {
          width: 100%;
        }
      }

      /* List view: a compact table — rendered directly as <table>, not the
         card markup (see renderCourseTable in the script below). */
      #course-grid.tv-list {
        display: block;
      }
      .tv-table th:last-child,
      .tv-table td:last-child {
        text-align: right;
      }
      .tc-title-link {
        color: inherit;
        text-decoration: none;
      }
      .tc-title-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

    <script src="../assets/js/core.js"></script>
    <script>
      /* ── Constants ───────────────────────────────────────────────── */
      var CAT_BADGE = {
        si: 'badge-cyan',
        hw: 'badge-blue',
        fw: 'badge-green',
        emc: 'badge-orange',
        power: 'badge-yellow',
        custom: 'badge-purple',
      };
      var CAT_LABEL = {
        si: 'Signal Integrity',
        hw: 'Hardware Design',
        fw: 'FPGA/MCU',
        emc: 'EMC & Compliance',
        power: 'Power Integrity',
        custom: 'Custom / Other',
      };

      /* ── Payment state ───────────────────────────────────────────── */
      var _payState = {
        courseId: null,
        base: 0,
        origPrice: 0,
        couponDiscount: 0,
        couponCode: null,
        gst: 0,
        total: 0,
      };

      function calcGst(amount) {
        return parseFloat((amount * 0.18).toFixed(2));
      }
      function calcTotal(base, disc) {
        var after = Math.max(0, base - disc);
        var gst = calcGst(after);
        return { after: after, gst: gst, total: parseFloat((after + gst).toFixed(2)) };
      }

      /* ── Validity badge ──────────────────────────────────────────── */
      function validityBadge(validUntil) {
        var until = new Date(validUntil);
        var days = Math.floor((until - Date.now()) / 86400000);
        var cls = days > 90 ? 'validity-ok' : days > 30 ? 'validity-warn' : 'validity-low';
        var label = until.toLocaleDateString('en-IN', {
          day: 'numeric',
          month: 'short',
          year: 'numeric',
        });
        return '<span class="validity-badge ' + cls + '">Valid till ' + label + '</span>';
      }

      /* ── Shared action/price logic (grid, detail and table views all use
         the same buy/start-learning/coming-soon rules) ─────────────────── */
      function getCourseAction(c, ownedMap) {
        var isPublished = c.status === 'published';
        var origPrice = parseFloat(c.original_price) || 0;
        var discPrice = parseFloat(c.discounted_price) || 0;
        var isFree = discPrice <= 0;
        var purchase = ownedMap[c.id];
        var isOwned = !!(
          purchase &&
          purchase.payment_status === 'paid' &&
          new Date(purchase.valid_until) > new Date()
        );

        var actionHtml, priceLabelHtml, actionCompactHtml;

        if (!isPublished) {
          actionHtml = '<button class="btn btn-outline btn-sm" disabled>Coming Soon</button>';
          priceLabelHtml = '';
          actionCompactHtml = '<span class="badge badge-gray">Coming Soon</span>';
        } else if (isOwned) {
          actionHtml =
            '<a href="' + (c.href || '#') + '" class="btn btn-primary btn-sm">Start Learning</a>';
          priceLabelHtml = validityBadge(purchase.valid_until);
          actionCompactHtml =
            '<a href="' + (c.href || '#') + '" class="btn btn-primary btn-sm">Start Learning</a>';
        } else if (isFree) {
          actionHtml =
            '<a href="' + (c.href || '#') + '" class="btn btn-primary btn-sm">Start Learning</a>';
          priceLabelHtml =
            '<span style="font-size:var(--text-xs);color:var(--success,#10b981);font-weight:600">Free</span>';
          actionCompactHtml = actionHtml;
        } else {
          /* Paid, not owned */
          var pct =
            origPrice > discPrice && origPrice > 0
              ? Math.round(((origPrice - discPrice) / origPrice) * 100)
              : 0;
          var demoBtn = c.demo_link
            ? '<a href="' +
              c.demo_link +
              '" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="margin-left:var(--sp-2)">Demo</a>'
            : '';
          actionHtml =
            '<div style="display:flex;align-items:center">' +
            '<button class="btn btn-primary btn-sm" onclick="openBuyCourse(\'' +
            c.id +
            '\')">Buy Course</button>' +
            demoBtn +
            '</div>';
          priceLabelHtml =
            '<span class="price-strike">&#8377;' +
            origPrice.toLocaleString('en-IN') +
            '</span>' +
            '<span class="price-sell">&#8377;' +
            discPrice.toLocaleString('en-IN') +
            '</span>' +
            (pct > 0 ? ' <span class="pct-off">' + pct + '% off</span>' : '');
          actionCompactHtml =
            '<button class="btn btn-primary btn-sm" onclick="openBuyCourse(\'' +
            c.id +
            '\')">Buy Course</button>';
        }

        return {
          isPublished: isPublished,
          isOwned: isOwned,
          actionHtml: actionHtml,
          priceLabelHtml: priceLabelHtml,
          actionCompactHtml: actionCompactHtml,
        };
      }

      /* ── Card renderer (Grid / Detail views) ─────────────────────── */
      function renderCourseCardDB(c, ownedMap) {
        var cat = c.category || 'custom';
        var badgeClass = CAT_BADGE[cat] || 'badge-gray';
        var catLabel = CAT_LABEL[cat] || cat;
        var gradient = c.gradient || 'linear-gradient(135deg,#0f2040,#0e3a5c)';
        var act = getCourseAction(c, ownedMap);
        var isPublished = act.isPublished;
        var isOwned = act.isOwned;
        var actionHtml = act.actionHtml;
        var priceLabelHtml = act.priceLabelHtml;

        return (
          '<div class="card training-card card-hover tv-item" data-category="' +
          cat +
          '" data-searchable style="position:relative;overflow:hidden">' +
          '<div class="training-card-image" style="background:' +
          gradient +
          '">' +
          '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">' +
          '<svg width="40" height="40" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5" viewBox="0 0 24 24">' +
          '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>' +
          '</svg></div></div>' +
          '<div class="training-card-body">' +
          '<div style="display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)">' +
          '<span class="badge ' +
          badgeClass +
          '">' +
          catLabel +
          '</span>' +
          (c.modules_count
            ? '<span class="badge badge-gray">' + c.modules_count + ' Modules</span>'
            : '') +
          (!isPublished ? '<span class="badge badge-gray">Coming Soon</span>' : '') +
          (isOwned ? '<span class="badge badge-green">Purchased</span>' : '') +
          '</div>' +
          '<h3 style="font-size:var(--text-md);margin-bottom:var(--sp-2)">' +
          '<a class="tc-title-link" href="' +
          (c.href || '#') +
          '">' +
          (c.title || '') +
          '</a>' +
          '</h3>' +
          '<p style="font-size:var(--text-sm);color:var(--text-sub);margin-bottom:var(--sp-4)">' +
          (c.description || '') +
          '</p>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap">' +
          actionHtml +
          '<span style="font-size:var(--text-xs)">' +
          priceLabelHtml +
          '</span>' +
          '</div>' +
          '</div></div>'
        );
      }

      /* ── Table renderer (List view) — Title / Category / Action, one row per course ─────────────────────────── */
      function renderCourseTableRow(c, ownedMap) {
        var cat = c.category || 'custom';
        var badgeClass = CAT_BADGE[cat] || 'badge-gray';
        var catLabel = CAT_LABEL[cat] || cat;
        var act = getCourseAction(c, ownedMap);

        return (
          '<tr class="tv-item" data-category="' +
          cat +
          '" data-searchable>' +
          '<td style="color:var(--text-base);font-weight:600">' +
          '<a class="tc-title-link" href="' +
          (c.href || '#') +
          '">' +
          (c.title || '') +
          '</a>' +
          (act.isOwned ? ' <span class="badge badge-green">Purchased</span>' : '') +
          '</td>' +
          '<td><span class="badge ' +
          badgeClass +
          '">' +
          catLabel +
          '</span></td>' +
          '<td>' +
          act.actionCompactHtml +
          '</td>' +
          '</tr>'
        );
      }

      function renderCourseTable(courses, ownedMap) {
        return (
          '<div class="table-wrap">' +
          '<table class="data-table tv-table">' +
          '<thead><tr>' +
          '<th>Title</th><th>Category</th><th>Action</th>' +
          '</tr></thead>' +
          '<tbody>' +
          courses
            .map(function (c) {
              return renderCourseTableRow(c, ownedMap);
            })
            .join('') +
          '</tbody>' +
          '</table>' +
          '</div>'
        );
      }

      /* ── Course sort ─────────────────────────────────────────────── */
      /* Paid courses always first; within each tier keep the server's order. */
      var _allCourses = [];
      var _ownedMap = {};

      function sortCourses(courses) {
        return courses.slice().sort(function (a, b) {
          // Paid = discounted_price > 0 → slot 0; free/coming-soon → slot 1
          var aPaid = (parseFloat(a.discounted_price) || 0) > 0 ? 0 : 1;
          var bPaid = (parseFloat(b.discounted_price) || 0) > 0 ? 0 : 1;
          // Within the same tier, keep the server's order (stable sort)
          return aPaid - bPaid;
        });
      }

      /* ── Buy Course modal ────────────────────────────────────────── */

      function openBuyCourse(courseId) {
        var c = _allCourses.find(function (x) {
          return x.id === courseId;
        });
        if (!c) return;

        _payState.courseId = courseId;
        _payState.couponDiscount = 0;
        _payState.couponCode = null;
        _payState.base = parseFloat(c.discounted_price) || 0;
        _payState.origPrice = parseFloat(c.original_price) || _payState.base;

        document.getElementById('pay-course-title').textContent = c.title || 'Buy Course';
        document.getElementById('pay-course-sub').textContent = CAT_LABEL[c.category] || '';
        document.getElementById('pay-coupon-input').value = '';
        document.getElementById('pay-coupon-msg').textContent = '';
        document.getElementById('pay-coupon-msg').style.color = '';
        document.getElementById('pay-coupon-row').style.display = 'none';
        document.getElementById('pay-err').style.display = 'none';
        document.getElementById('pay-btn').textContent = 'Proceed to Pay';
        document.getElementById('pay-btn').disabled = false;
        updatePayBreakdown();
        openModal('modal-buy-course');
      }

      function updatePayBreakdown() {
        var disc = _payState.couponDiscount;
        var t = calcTotal(_payState.base, disc);
        _payState.gst = t.gst;
        _payState.total = t.total;

        var mrpEl = document.getElementById('pay-mrp');
        if (_payState.origPrice > _payState.base) {
          mrpEl.textContent = '₹' + _payState.origPrice.toLocaleString('en-IN');
          mrpEl.style.display = '';
        } else {
          mrpEl.style.display = 'none';
        }
        document.getElementById('pay-base').textContent =
          '₹' + _payState.base.toLocaleString('en-IN');
        document.getElementById('pay-gst').textContent = '₹' + t.gst.toLocaleString('en-IN');
        document.getElementById('pay-total').textContent = '₹' + t.total.toLocaleString('en-IN');

        if (disc > 0) {
          document.getElementById('pay-coupon-row').style.display = 'flex';
          document.getElementById('pay-coupon-amt').textContent = disc.toLocaleString('en-IN');
        }
      }

      function applyCouponCode() {
        var code = document.getElementById('pay-coupon-input').value.trim();
        if (!code) return;
        var msgEl = document.getElementById('pay-coupon-msg');
        var btn = document.getElementById('pay-coupon-btn');

        var session = (function () {
          try {
            return JSON.parse(localStorage.getItem('re_session') || '{}');
          } catch (e) {
            return {};
          }
        })();
        var token = session.accessToken || session.token || '';
        if (!token) {
          msgEl.style.color = 'var(--danger)';
          msgEl.textContent = 'Please sign in to apply a coupon.';
          return;
        }

        btn.textContent = 'Checking…';
        btn.disabled = true;
        msgEl.textContent = '';

        fetch('/api/coupons/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ code: code, context: 'course', amount: _payState.base }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (json) {
            btn.textContent = 'Apply';
            btn.disabled = false;
            if (json.success) {
              var disc = parseFloat(json.discount) || 0;
              _payState.couponDiscount = disc;
              _payState.couponCode = code;
              updatePayBreakdown();
              msgEl.style.color = 'var(--success,#10b981)';
              msgEl.textContent = 'Coupon applied! You save ₹' + disc.toLocaleString('en-IN') + '.';
            } else {
              _payState.couponDiscount = 0;
              _payState.couponCode = null;
              document.getElementById('pay-coupon-row').style.display = 'none';
              updatePayBreakdown();
              msgEl.style.color = 'var(--danger)';
              msgEl.textContent = json.error || 'Invalid coupon.';
            }
          })
          .catch(function () {
            btn.textContent = 'Apply';
            btn.disabled = false;
            msgEl.style.color = 'var(--danger)';
            msgEl.textContent = 'Could not verify coupon. Try again.';
          });
      }

      function initiateCoursePurchase() {
        var session = (function () {
          try {
            return JSON.parse(localStorage.getItem('re_session') || '{}');
          } catch (e) {
            return {};
          }
        })();
        var token = session.accessToken || session.token || '';
        if (!token) {
          document.getElementById('pay-err').textContent = 'Please sign in to purchase.';
          document.getElementById('pay-err').style.display = 'block';
          return;
        }

        var btn = document.getElementById('pay-btn');
        var errEl = document.getElementById('pay-err');
        btn.textContent = 'Creating order…';
        btn.disabled = true;
        errEl.style.display = 'none';

        fetch('/api/cashfree/create-course-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({
            courseId: _payState.courseId,
            couponCode: _payState.couponCode || undefined,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (json) {
            if (!json.success || !json.paymentSessionId) {
              throw new Error(json.error || 'Could not create order.');
            }
            var mode =
              window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'sandbox'
                : 'production';
            var cashfree = new Cashfree({ mode: mode });
            return cashfree.checkout({
              paymentSessionId: json.paymentSessionId,
              returnUrl:
                window.location.origin + '/Trainings/verify-purchase.html?order_id=' + json.orderId,
            });
          })
          .catch(function (err) {
            btn.textContent = 'Proceed to Pay';
            btn.disabled = false;
            errEl.textContent = err.message || 'Payment failed. Please try again.';
            errEl.style.display = 'block';
          });
      }

      /* ── Modal helpers ───────────────────────────────────────────── */
      function openModal(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.removeAttribute('hidden');
        el.classList.add('open');
        el.setAttribute('aria-modal', 'true');
        document.body.style.overflow = 'hidden';
      }
      function closeModal(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('open');
        el.setAttribute('hidden', '');
        document.body.style.overflow = '';
      }
      document.addEventListener('click', function (e) {
        if (e.target.classList.contains('modal-backdrop')) {
          e.target.classList.remove('open');
          e.target.setAttribute('hidden', '');
          document.body.style.overflow = '';
        }
      });

      /* ── Filter & search — works against whichever markup the current
         view rendered (cards or table rows), both tagged .tv-item ──────── */
      function wireFiltersAndSearch() {
        document.querySelectorAll('.filter-pill').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-pill').forEach(function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
            applyCurrentFilterAndSearch();
          });
        });
        var searchInput = document.querySelector('[data-search]');
        if (searchInput) {
          searchInput.addEventListener('input', function () {
            applyCurrentFilterAndSearch();
          });
        }
      }

      function applyCurrentFilterAndSearch() {
        var activeBtn = document.querySelector('.filter-pill.active');
        var f = activeBtn ? activeBtn.dataset.filter : 'all';
        var searchInput = document.querySelector('[data-search]');
        var q = searchInput ? searchInput.value.toLowerCase() : '';
        document.querySelectorAll('#course-grid .tv-item').forEach(function (item) {
          var matchesFilter = f === 'all' || item.dataset.category === f;
          var matchesSearch = !q || item.textContent.toLowerCase().indexOf(q) !== -1;
          item.style.display = matchesFilter && matchesSearch ? '' : 'none';
        });
        checkEmpty();
      }

      function checkEmpty() {
        var vis = document.querySelectorAll('#course-grid .tv-item:not([style*="none"])').length;
        document.getElementById('course-empty').style.display = vis === 0 ? 'block' : 'none';
      }

      /* ── View switcher (Grid / List / Detail) ────────────────────── */
      /* Rebuilds #course-grid from the currently loaded data whenever the
         view changes — list needs a real <table>, grid/detail need cards,
         so this can't be done with CSS alone. */
      function renderTrainingsList() {
        var grid = document.getElementById('course-grid');
        if (!grid || !_allCourses.length) return;
        var view = grid.classList.contains('tv-list')
          ? 'list'
          : grid.classList.contains('tv-detail')
            ? 'detail'
            : 'grid';
        grid.innerHTML =
          view === 'list'
            ? renderCourseTable(_allCourses, _ownedMap)
            : _allCourses
                .map(function (c) {
                  return renderCourseCardDB(c, _ownedMap);
                })
                .join('');
        applyCurrentFilterAndSearch();
      }

      function applyTrainingsView(view) {
        var grid = document.getElementById('course-grid');
        if (!grid) return;
        if (['grid', 'list', 'detail'].indexOf(view) === -1) view = 'grid';
        grid.classList.remove('tv-grid', 'tv-list', 'tv-detail');
        grid.classList.add('tv-' + view);
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-view') === view);
        });
        try {
          localStorage.setItem('re_trainings_view', view);
        } catch (e) {
          /* ignore storage errors */
        }
        renderTrainingsList();
      }

      function wireViewToggle() {
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            applyTrainingsView(b.getAttribute('data-view'));
          });
        });
        var stored = 'grid';
        try {
          stored = localStorage.getItem('re_trainings_view') || 'grid';
        } catch (e) {
          stored = 'grid';
        }
        applyTrainingsView(stored);
      }

      /* ── Boot ────────────────────────────────────────────────────── */
      document.addEventListener('DOMContentLoaded', function () {
        var grid = document.getElementById('course-grid');
        var empty = document.getElementById('course-empty');

        wireViewToggle();
        wireFiltersAndSearch();

        var token = typeof reGetToken === 'function' ? reGetToken() : '';

        var coursesP = fetch('/api/courses')
          .then(function (r) {
            return r.json();
          })
          .catch(function () {
            return null;
          });

        /* Use reApiFetch so the 15-min access token is silently refreshed on 401 */
        var purchasesP = token
          ? reApiFetch('/api/courses/my-purchases')
              .then(function (r) {
                return r.json();
              })
              .catch(function () {
                return null;
              })
          : Promise.resolve(null);

        Promise.all([coursesP, purchasesP]).then(function (results) {
          var coursesRes = results[0];
          var purchasesRes = results[1];

          /* Build owned-course map: courseId -> purchase record */
          var ownedMap = {};
          if (purchasesRes && purchasesRes.success && purchasesRes.data) {
            purchasesRes.data.forEach(function (p) {
              if (p.payment_status === 'paid') ownedMap[p.course_id] = p;
            });
          }

          var courses = coursesRes && coursesRes.success && coursesRes.data ? coursesRes.data : [];
          /* Sort: paid first, server order within each tier */
          _allCourses = sortCourses(courses);
          _ownedMap = ownedMap;

          if (courses.length === 0) {
            empty.style.display = 'block';
            return;
          }
          renderTrainingsList();
        });
      });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
