<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <meta
      name="description"
      content="Verify the authenticity of a Rising Edge Technologies certificate."
    />
    <title>Verify Certificate | Rising Edge Technologies</title>
    <link rel="canonical" href="https://www.risingedgetech.com/Certificate/verify.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <link rel="stylesheet" href="css/certificate.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="global-nav"></div>
    <div class="cert-page">
      <div class="cert-container" style="max-width: 720px">
        <div class="cert-page-header">
          <div>
            <nav class="breadcrumb">
              <a href="../home.html">Home</a><span>/</span><a href="index.html">Certificates</a
              ><span>/</span><span>Verify</span>
            </nav>
            <h1 class="cert-page-title">Verify Certificate</h1>
            <p class="cert-page-sub">
              Enter a certificate number to check its authenticity and current status.
            </p>
          </div>
        </div>

        <!-- Search form -->
        <div class="card card-body" style="margin-bottom: var(--sp-6)">
          <form id="verify-form" novalidate>
            <div class="form-group" style="margin-bottom: var(--sp-4)">
              <label class="form-label" for="cert-id-input">Certificate Number</label>
              <div style="display: flex; gap: var(--sp-3)">
                <input
                  class="input"
                  id="cert-id-input"
                  name="certId"
                  type="text"
                  placeholder="e.g. RET-2026-SIA201-000451"
                  required
                  style="font-family: monospace; letter-spacing: 0.06em; flex: 1"
                />
                <button type="submit" class="btn btn-primary">
                  <svg
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <polyline points="9 11 12 14 22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                  </svg>
                  Verify
                </button>
              </div>
              <p class="form-help">Format: RET-YEAR-CODE-NNNNNN</p>
            </div>
          </form>
        </div>

        <!-- Result renders here -->
        <div id="verify-result"></div>

        <!-- Full certificate document (rendered from the template for valid certs) -->
        <div id="cert-doc-wrap" style="display: none; margin-top: var(--sp-6)">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              flex-wrap: wrap;
              gap: 8px;
              margin-bottom: var(--sp-3);
            "
          >
            <h2 style="font-size: var(--text-lg)">Certificate</h2>
            <button class="btn btn-primary btn-sm" id="cert-dl-btn" type="button">
              Download PDF
            </button>
          </div>
          <div id="cert-doc-scaler" style="overflow: hidden">
            <div id="cert-doc-host"></div>
          </div>
        </div>

        <!-- Public info -->
        <div style="text-align: center; padding: var(--sp-8) 0 0">
          <p
            style="font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--sp-3)"
          >
            You can also verify by scanning the QR code on the certificate.
          </p>
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: var(--sp-6);
              flex-wrap: wrap;
            "
          >
            <div style="text-align: center">
              <div style="font-size: 1.5rem; margin-bottom: 4px">✓</div>
              <div style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 600">
                Authentic
              </div>
            </div>
            <div style="text-align: center">
              <div style="font-size: 1.5rem; margin-bottom: 4px">🔒</div>
              <div style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 600">
                Tamper-Proof
              </div>
            </div>
            <div style="text-align: center">
              <div style="font-size: 1.5rem; margin-bottom: 4px">⚡</div>
              <div style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 600">
                Instant
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="global-footer"></div>
    <div id="global-bottom-nav"></div>
    <script src="../assets/js/core.js"></script>
    <script src="js/certificate-api.js"></script>
    <script src="js/qr-generator.js"></script>
    <script src="js/certificate-renderer.js"></script>
    <script src="js/pdf-generator.js"></script>
    <script src="js/email.js"></script>

    <script src="js/certificate.js"></script>
    <script>
      /* Render the full certificate DOCUMENT (from templates/certificate-template.html
         + assets/*.svg) for a valid certificate. Challenge-close certs email a link
         to this page, so this is where the templated certificate is produced for
         challenge results. Course-issued certs render the same way. */
      (function () {
        var host = document.getElementById('cert-doc-host');
        var wrap = document.getElementById('cert-doc-wrap');
        if (!host || !wrap || !window.CertAPI || !window.CertRenderer) return;

        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) return;

        function fmtDate(d) {
          if (!d) return '';
          var dt = new Date(d);
          return isNaN(dt)
            ? String(d)
            : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // A4 landscape (1123px) scaled to fit the container — same approach the
        // preview page uses (transform: scale + margin-bottom correction).
        function scaleDoc() {
          var doc = host.querySelector('.cert-doc');
          var scaler = document.getElementById('cert-doc-scaler');
          if (!doc || !scaler) return;
          var avail = scaler.clientWidth;
          var n = Math.min(1, avail / 1123);
          doc.style.transformOrigin = 'top left';
          doc.style.transform = 'scale(' + n + ')';
          doc.style.marginBottom = 'calc(-794px * (1 - ' + n + '))';
        }

        // Parse a "key: value" markdown content file into an object (ignores
        // comment/blank lines). Lets the challenge certificate copy be edited
        // in Certificate/content/challenge-certificate.md without code changes.
        function parseContentMd(text) {
          var out = {};
          String(text || '')
            .split(/\r?\n/)
            .forEach(function (line) {
              var l = line.trim();
              if (!l || l.indexOf('<!--') === 0 || l.indexOf('-->') === 0) return;
              var i = l.indexOf(':');
              if (i > 0) {
                out[l.slice(0, i).trim()] = l.slice(i + 1).trim();
              }
            });
          return out;
        }

        function showDoc() {
          wrap.style.display = 'block';
          scaleDoc();
          window.addEventListener('resize', scaleDoc);
        }

        CertAPI.verify(id)
          .then(function (res) {
            if (!res || !res.valid) return; // revoked/expired/not-found — result card already shown
            var c = res.certificate || {};
            var isChallenge = res.type === 'challenge' || c.kind === 'challenge';
            var certNum = c.certificateNumber || id;
            var verificationUrl =
              window.location.origin +
              window.location.pathname +
              '?id=' +
              encodeURIComponent(certNum);

            if (isChallenge) {
              // Challenge certificate — copy read from the .md, rendered with
              // the challenge-specific template.
              var tmplUrl = new URL(
                'templates/challenge-certificate-template.html',
                document.baseURI
              ).href;
              var mdUrl = new URL('content/challenge-certificate.md', document.baseURI).href;
              return Promise.all([
                fetch(tmplUrl).then(function (r) {
                  return r.text();
                }),
                fetch(mdUrl)
                  .then(function (r) {
                    return r.text();
                  })
                  .catch(function () {
                    return '';
                  }),
              ]).then(function (parts) {
                var tmpl = parts[0];
                var copy = parseContentMd(parts[1]);
                var data = Object.assign({}, copy, {
                  candidateName: c.candidateName || 'Rising Edge Member',
                  courseName: c.courseName || 'Weekly Hardware Design Challenge',
                  challengeCode: copy.challengeCode || 'WHDC',
                  grade: c.rank ? 'Rank #' + c.rank : 'Top Finisher',
                  completionDate: c.completionDate,
                  issueDate: c.issueDate,
                  certificateNumber: certNum,
                  enrollmentId: certNum,
                  verificationUrl: verificationUrl,
                });
                return CertRenderer.renderInto(host, data, tmpl).then(showDoc);
              });
            }

            // Course certificate — default template.
            var courseData = {
              candidateName: c.candidateName || 'Rising Edge Member',
              courseName: c.courseName || 'Rising Edge Programme',
              completionDate: c.completionDate,
              issueDate: c.issueDate,
              grade: 'Completed',
              instructor: 'Rising Edge Technologies',
              certificateNumber: certNum,
              enrollmentId: certNum,
              verificationUrl: verificationUrl,
            };
            return CertRenderer.renderInto(host, courseData).then(showDoc);
          })
          .catch(function () {
            /* rendering is best-effort — the verification result still shows */
          });

        var dlBtn = document.getElementById('cert-dl-btn');
        if (dlBtn) {
          dlBtn.addEventListener('click', function () {
            var doc = host.querySelector('.cert-doc');
            if (!doc || !window.PDFGenerator) return;
            var prev = doc.style.transform;
            var prevMb = doc.style.marginBottom;
            doc.style.transform = 'none';
            doc.style.marginBottom = '0';
            dlBtn.disabled = true;
            dlBtn.textContent = 'Preparing…';
            Promise.resolve(PDFGenerator.download(doc, 'RisingEdge-Certificate-' + id))
              .catch(function () {})
              .then(function () {
                doc.style.transform = prev;
                doc.style.marginBottom = prevMb;
                dlBtn.disabled = false;
                dlBtn.textContent = 'Download PDF';
              });
          });
        }
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
