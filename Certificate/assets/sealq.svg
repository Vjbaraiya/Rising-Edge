<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 200 200" width="200" height="200">
  <defs>

    <!-- ── 3-D shadow & specular filters ── -->
    <filter id="dropshadow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blur"/>
      <feOffset dx="3" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#2a1500" flood-opacity="0.65" result="col"/>
      <feComposite in="col" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="gf" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0" result="g"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.85" intercept="0.10"/>
        <feFuncG type="linear" slope="0.70" intercept="0.04"/>
        <feFuncB type="linear" slope="0.22" intercept="0"/>
        <feFuncA type="linear" slope="1" intercept="0"/>
      </feComponentTransfer>
    </filter>

    <!-- ── Metallic gold gradient (3-D light from upper-left) ── -->
    <radialGradient id="metalOuter" cx="32%" cy="27%" r="72%">
      <stop offset="0%"   stop-color="#fff8c8"/>
      <stop offset="18%"  stop-color="#f4dc5a"/>
      <stop offset="45%"  stop-color="#D4AF37"/>
      <stop offset="72%"  stop-color="#a07820"/>
      <stop offset="90%"  stop-color="#7a5500"/>
      <stop offset="100%" stop-color="#3d2400"/>
    </radialGradient>

    <!-- Band gradient — bright with 3-D sheen -->
    <radialGradient id="metalBand" cx="30%" cy="25%" r="75%">
      <stop offset="0%"   stop-color="#fffad0"/>
      <stop offset="25%"  stop-color="#f0d458"/>
      <stop offset="55%"  stop-color="#c8900a"/>
      <stop offset="80%"  stop-color="#a07010"/>
      <stop offset="100%" stop-color="#7a5500"/>
    </radialGradient>

    <!-- Rim bevel — linear top-left light to bottom-right shadow -->
    <linearGradient id="rimBevel" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#D4AF37" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Inner concave shading (dark recess) -->
    <radialGradient id="innerRecess" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3a2400"/>
      <stop offset="60%"  stop-color="#1e1200"/>
      <stop offset="100%" stop-color="#0a0600"/>
    </radialGradient>

    <!-- Circuit trace gold -->
    <radialGradient id="traceGold" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#f8e880"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9a6e00"/>
    </radialGradient>

    <!-- Logo bg gradient — warm gold concave -->
    <radialGradient id="logoBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#d4b060"/>
      <stop offset="50%"  stop-color="#c2960a"/>
      <stop offset="100%" stop-color="#7a5000"/>
    </radialGradient>

  </defs>

  <!-- ══ 3-D DROP SHADOW (offset disc behind seal) ══ -->
  <circle cx="103.5" cy="106" r="95" fill="#1a0c00" opacity="0.40"
          filter="url(#soften)"/>

  <!-- ══ OUTER METALLIC RIM (3-D raised disc) ══ -->
  <circle cx="100" cy="100" r="97" fill="url(#metalOuter)"/>

  <!-- Bevel highlight/shadow overlay on rim -->
  <circle cx="100" cy="100" r="97" fill="url(#rimBevel)"/>

  <!-- Specular highlight arc (top-left crescent) -->
  <ellipse cx="72" cy="65" rx="34" ry="26"
           fill="white" opacity="0.16" filter="url(#soften)"/>

  <!-- ══ GOLD TEXT BAND ══ -->
  <!-- Outer border of band -->
  <circle cx="100" cy="100" r="92" fill="url(#metalBand)"/>
  <!-- Bevel on band -->
  <circle cx="100" cy="100" r="92" fill="url(#rimBevel)" opacity="0.7"/>

  <!-- ══ INNER DARK RECESS (concave look) ══ -->
  <circle cx="100" cy="100" r="70" fill="url(#innerRecess)"/>

  <!-- Inner-shadow ring (darkens the edge of recess for depth) -->
  <circle cx="100" cy="100" r="70" fill="none"
          stroke="#000000" stroke-width="4" opacity="0.55"/>

  <!-- Band-to-recess groove line -->
  <circle cx="100" cy="100" r="70" fill="none"
          stroke="#6b4c00" stroke-width="0.8" opacity="0.9"/>
  <circle cx="100" cy="100" r="68" fill="none"
          stroke="#d4af37" stroke-width="0.4" opacity="0.6"/>

  <!-- ══ CIRCUIT TRACES ══ -->
  <g fill="url(#traceGold)" stroke="url(#traceGold)" stroke-width="1.0" opacity="0.70">
    <line x1="100.0" y1="40.0" x2="100.0" y2="34.0"/>
    <circle cx="100.0" cy="34.0" r="1.2"/>
    <line x1="126.0" y1="45.9" x2="128.6" y2="40.5"/>
    <circle cx="128.6" cy="40.5" r="1.2"/>
    <line x1="146.9" y1="62.6" x2="151.6" y2="58.8"/>
