    <circle cx="100.0" cy="166.0" r="1.2"/>
    <line x1="74.0" y1="154.1" x2="71.4" y2="159.5"/>
    <circle cx="71.4" cy="159.5" r="1.2"/>
    <line x1="53.1" y1="137.4" x2="48.4" y2="141.2"/>
    <circle cx="48.4" cy="141.2" r="1.2"/>
    <line x1="41.5" y1="113.4" x2="35.7" y2="114.7"/>
    <circle cx="35.7" cy="114.7" r="1.2"/>
    <line x1="41.5" y1="86.6" x2="35.7" y2="85.3"/>
    <circle cx="35.7" cy="85.3" r="1.2"/>
    <line x1="53.1" y1="62.6" x2="48.4" y2="58.8"/>
    <circle cx="48.4" cy="58.8" r="1.2"/>
    <line x1="74.0" y1="45.9" x2="71.4" y2="40.5"/>
    <circle cx="71.4" cy="40.5" r="1.2"/>
    <circle cx="77.4" cy="53.1" r="1.8"/>
    <circle cx="122.6" cy="53.1" r="1.8"/>
    <circle cx="150.7" cy="88.4" r="1.8"/>
    <circle cx="140.7" cy="132.4" r="1.8"/>
    <circle cx="100.0" cy="152.0" r="1.8"/>
    <circle cx="59.3" cy="132.4" r="1.8"/>
    <circle cx="49.3" cy="88.4" r="1.8"/>
    <polyline points="77.4,53.1 100.0,54.0 122.6,53.1" fill="none"/>
    <polyline points="122.6,53.1 136.0,71.3 150.7,88.4" fill="none"/>
    <polyline points="150.7,88.4 144.8,110.2 140.7,132.4" fill="none"/>
    <polyline points="140.7,132.4 120.0,141.4 100.0,152.0" fill="none"/>
    <polyline points="100.0,152.0 80.0,141.4 59.3,132.4" fill="none"/>
    <polyline points="59.3,132.4 55.2,110.2 49.3,88.4" fill="none"/>
    <polyline points="49.3,88.4 136.0,128.7 77.4,53.1" fill="none"/>
    <circle cx="100" cy="100" r="66" fill="none" stroke-width="0.6"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke-width="0.5"/>
  </g>

  <!-- ══ LOGO BACKGROUND (raised button look) ══ -->
  <circle cx="100" cy="100" r="43" fill="url(#logoBg)"/>
  <!-- Logo button highlight -->
  <circle cx="100" cy="100" r="43" fill="url(#rimBevel)" opacity="0.6"/>
  <!-- Logo button edge -->
  <circle cx="100" cy="100" r="43" fill="none"
          stroke="#6b4c00" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="41.5" fill="none"
          stroke="#d4af37" stroke-width="0.5" opacity="0.7"/>

  <!-- ══ RE LOGO ══ -->
  <image href="../../assets/images/RE_Logo1.png"
         x="12" y="12" width="150" height="150"
         filter="url(#gf)" preserveAspectRatio="xMidYMid meet"
         clip-path="url(#logoClip)"/>

