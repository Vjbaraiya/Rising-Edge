<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" preserveAspectRatio="none">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#C0A030"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>
  </defs>
  <!-- Outer gold border -->
  <rect x="6" y="6" width="1111" height="782" rx="4" ry="4"
        fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <!-- Inner fine border -->
  <rect x="14" y="14" width="1095" height="766" rx="2" ry="2"
        fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="6 4"/>
  <!-- Inner solid border -->
  <rect x="20" y="20" width="1083" height="754" rx="2" ry="2"
        fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.6"/>
  <!-- Corner ornaments — top-left -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.5">
    <line x1="6" y1="50" x2="40" y2="50"/>
    <line x1="50" y1="6" x2="50" y2="40"/>
    <rect x="30" y="30" width="20" height="20" fill="#D4AF37" opacity="0.3"/>
    <circle cx="40" cy="40" r="6" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  <!-- Corner ornaments — top-right -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.5">
    <line x1="1117" y1="50" x2="1083" y2="50"/>
    <line x1="1073" y1="6" x2="1073" y2="40"/>
    <rect x="1073" y="30" width="20" height="20" fill="#D4AF37" opacity="0.3"/>
    <circle cx="1083" cy="40" r="6" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  <!-- Corner ornaments — bottom-left -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.5">
    <line x1="6" y1="744" x2="40" y2="744"/>
    <line x1="50" y1="788" x2="50" y2="754"/>
    <rect x="30" y="744" width="20" height="20" fill="#D4AF37" opacity="0.3"/>
    <circle cx="40" cy="754" r="6" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  <!-- Corner ornaments — bottom-right -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.5">
    <line x1="1117" y1="744" x2="1083" y2="744"/>
    <line x1="1073" y1="788" x2="1073" y2="754"/>
    <rect x="1073" y="744" width="20" height="20" fill="#D4AF37" opacity="0.3"/>
    <circle cx="1083" cy="754" r="6" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  <!-- Mid-side ornament marks -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.5">
    <line x1="6" y1="397" x2="22" y2="397"/>
    <line x1="1101" y1="397" x2="1117" y2="397"/>
    <line x1="561" y1="6" x2="561" y2="22"/>
    <line x1="561" y1="772" x2="561" y2="788"/>
    <circle cx="14" cy="397" r="3" fill="#D4AF37"/>
    <circle cx="1109" cy="397" r="3" fill="#D4AF37"/>
    <circle cx="561" cy="14" r="3" fill="#D4AF37"/>
    <circle cx="561" cy="780" r="3" fill="#D4AF37"/>
  </g>
</svg>