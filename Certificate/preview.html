<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <meta name="description" content="Live certificate preview and download." />
    <title>Certificate Preview | Rising Edge Technologies</title>
    <link rel="canonical" href="https://www.risingedgetech.com/Certificate/preview.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <link rel="stylesheet" href="css/certificate.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="global-nav"></div>
    <div class="cert-page">
      <div class="cert-container">
        <div class="cert-page-header">
          <div>
            <nav class="breadcrumb">
              <a href="../home.html">Home</a><span>/</span><a href="index.html">Certificates</a
              ><span>/</span><span>Preview</span>
            </nav>
            <h1 class="cert-page-title">Certificate Preview</h1>
            <p class="cert-page-sub">
              Live A4-landscape preview. Download as PDF, PNG, or send to print.
            </p>
          </div>
          <div class="cert-page-actions">
            <a href="index.html" class="btn btn-ghost btn-sm">← Back</a>
            <button class="btn btn-outline btn-sm" id="btn-print">
              <svg
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <polyline points="6 9 6 2 18 2 18 9" />
                <path
                  d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
                />
                <rect x="6" y="14" width="12" height="8" />
              </svg>
              Print
            </button>
            <button class="btn btn-outline btn-sm" id="btn-download-png">
              <svg
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              PNG
            </button>
            <button class="btn btn-primary btn-sm" id="btn-download-pdf">
              <svg
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download PDF
            </button>
          </div>
        </div>

        <!-- Preview wrapper -->
        <div class="cert-preview-wrap">
          <div class="cert-preview-toolbar">
            <div style="display: flex; align-items: center; gap: var(--sp-3)">
              <span style="font-size: var(--text-sm); font-weight: 600; color: var(--text-sub)"
                >A4 Landscape — 297mm × 210mm</span
              >
              <span class="badge badge-green">Print Ready</span>
            </div>
            <div style="display: flex; align-items: center; gap: var(--sp-3)">
              <label style="font-size: var(--text-xs); color: var(--text-muted)">Zoom</label>
              <select
                class="input"
                id="zoom-select"
                style="padding: 4px 8px; font-size: var(--text-xs); width: auto"
              >
                <option value="0.5">50%</option>
                <option value="0.65" selected>65%</option>
                <option value="0.8">80%</option>
                <option value="1">100%</option>
              </select>
            </div>
          </div>
          <div class="cert-preview-scale" id="cert-preview-scale">
            <div
              id="cert-doc-container"
              style="
                transform-origin: top left;
                transform: scale(0.65);
                width: 1123px;
                height: 794px;
                margin-bottom: calc(-794px * 0.35);
              "
            >
              <!-- Certificate renders here -->
              <div
                style="
                  width: 1123px;
                  height: 794px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: var(--bg-card);
                "
              >
                <div style="text-align: center; color: var(--text-faint)">
                  <svg
                    width="48"
                    height="48"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24"
                    style="margin: 0 auto var(--sp-3)"
                  >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                  </svg>
                  <p style="font-size: var(--text-sm)">Loading certificate…</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('zoom-select').addEventListener('change', function () {
        var z = parseFloat(this.value);
        var container = document.getElementById('cert-doc-container');
        if (container) {
          container.style.transform = 'scale(' + z + ')';
          container.style.marginBottom = 'calc(-794px * ' + (1 - z) + ')';
        }
      });
    </script>

    <div id="global-footer"></div>
    <div id="global-bottom-nav"></div>
    <script src="../assets/js/core.js"></script>
    <script src="js/certificate-api.js"></script>
    <script src="js/qr-generator.js"></script>
    <script src="js/certificate-renderer.js"></script>
    <script src="js/pdf-generator.js"></script>
    <script src="js/email.js"></script>

    <script src="js/certificate.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
