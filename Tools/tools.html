<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <meta
      name="description"
      content="Rising Edge interactive engineering tools — impedance calculators, simulators, and estimators."
    />
    <title>Tools | Rising Edge Technologies</title>
    <link rel="canonical" href="https://www.risingedgetech.com/Tools/tools.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      .content-views-chip,
      .content-like-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* ── View switcher (Grid / List) ── */
      .view-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .view-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 34px;
        background: var(--bg-card);
        border: none;
        border-right: 1px solid var(--border);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .view-btn:last-child {
        border-right: none;
      }
      .view-btn:hover {
        background: var(--bg-hover);
        color: var(--text-base);
      }
      .view-btn.active {
        background: rgba(37, 99, 235, 0.12);
        color: var(--primary-400);
      }

      /* Detail view: one full-width card per row instead of a multi-column
         grid — same card markup as Grid, just given more room. */
      #tools-grid.rv-detail {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }

      /* List view: a compact table — rendered directly as <table>, not the
         card markup (see renderToolTable in the script below). */
      #tools-grid.rv-list {
        display: block;
      }
      .rv-table th:last-child,
      .rv-table td:last-child {
        text-align: right;
      }
      .rc-title-link {
        color: inherit;
        text-decoration: none;
      }
      .rc-title-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="global-nav"></div>

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../home.html">Home</a><span>/</span><span>Tools</span>
        </nav>
        <h1>Engineering Tools</h1>
        <p style="color: var(--text-sub); margin-top: var(--sp-2)">
          Interactive calculators, simulators, and estimators — free to use, no login required.
        </p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <h2 class="sr-only">Browse all tools</h2>
        <div
          style="
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-3);
            align-items: center;
            margin-bottom: var(--sp-8);
          "
        >
          <div class="filter-pills" data-filter-group>
            <button class="filter-pill active" data-filter="all">All Tools</button>
            <button class="filter-pill" data-filter="calculator">Calculators</button>
            <button class="filter-pill" data-filter="simulator">Simulators</button>
            <button class="filter-pill" data-filter="estimator">Estimators</button>
            <button class="filter-pill" data-filter="analyzer">Analyzers</button>
          </div>
          <div class="view-toggle" role="group" aria-label="View mode" style="margin-left: auto">
            <button
              class="view-btn active"
              data-view="grid"
              title="Grid view"
              aria-label="Grid view"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
            </button>
            <button class="view-btn" data-view="list" title="List view" aria-label="List view">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
            <button
              class="view-btn"
              data-view="detail"
              title="Detail view"
              aria-label="Detail view"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="4" width="7" height="16" rx="1" />
                <line x1="13" y1="7" x2="21" y2="7" />
                <line x1="13" y1="12" x2="21" y2="12" />
                <line x1="13" y1="17" x2="18" y2="17" />
              </svg>
            </button>
          </div>
          <div class="search-wrap" style="max-width: 240px">
            <svg
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              class="input"
              type="search"
              placeholder="Search tools…"
              data-search
              aria-label="Search tools"
            />
          </div>
        </div>

        <div class="cards-grid" id="tools-grid">
          <!-- rendered by JS -->
        </div>

        <div
          id="tools-empty"
          style="
            display: none;
            text-align: center;
            padding: var(--sp-16) 0;
            color: var(--text-faint);
          "
        >
          <svg
            width="40"
            height="40"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
            style="margin: 0 auto var(--sp-4)"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
          No tools match your filter.
        </div>
      </div>
    </section>

    <div id="global-footer"></div>
    <div id="global-bottom-nav"></div>
    <script src="../assets/js/core.js"></script>
    <script>
      /* Plan hierarchy — higher index = higher tier */
      var PLAN_RANK = { basic: 0, advanced: 1, premium: 2 };
      var PLAN_LABEL = { basic: 'Basic', advanced: 'Advanced', premium: 'Premium' };

      function userCanAccess(toolPlan, userPlan) {
        var required = PLAN_RANK[toolPlan] || 0;
        var current = PLAN_RANK[userPlan] || 0;
        return current >= required;
      }

      /* ── Shared access/action logic (grid, detail and table rows all use
         the same plan-gating rules) ───────────────────────────────────── */
      function getToolAccess(t, userPlan) {
        var toolPlan = t.plan || 'basic';
        var hasAccess = userCanAccess(toolPlan, userPlan);
        var isPaid = toolPlan !== 'basic';

        var planBadge = isPaid
          ? '<span class="badge ' +
            (toolPlan === 'premium' ? 'badge-purple' : 'badge-blue') +
            '" style="margin-left:var(--sp-2);font-size:.625rem">' +
            PLAN_LABEL[toolPlan] +
            '</span>'
          : '';

        var actionBtn = hasAccess
          ? '<a href="' +
            (t.url || '#') +
            '" class="btn btn-secondary btn-sm rc-action" onclick="reRecordContentView(\'tool\',\'' +
            t.id +
            '\')">Open Tool</a>'
          : '<a href="../subscription/plans.html" class="btn btn-primary btn-sm rc-action">Upgrade to Access</a>';

        /* Title link — access-gated the same way the action button is, so
           the compact list view can't bypass the plan gate. */
        var titleHref = hasAccess ? t.url || '#' : '../subscription/plans.html';
        var titleExtra = hasAccess ? " onclick=\"reRecordContentView('tool','" + t.id + '\')"' : '';
        var titleLink =
          '<a class="rc-title-link" href="' +
          titleHref +
          '"' +
          titleExtra +
          '>' +
          (t.title || '') +
          '</a>' +
          (!hasAccess
            ? ' <span title="' +
              PLAN_LABEL[toolPlan] +
              ' plan required" style="font-size:0.75rem">🔒</span>'
            : '');

        return {
          toolPlan: toolPlan,
          hasAccess: hasAccess,
          planBadge: planBadge,
          actionBtn: actionBtn,
          titleLink: titleLink,
        };
      }

      function renderToolCardWithAccess(t, userPlan) {
        var catLabel =
          (typeof CATEGORY_LABEL !== 'undefined' && CATEGORY_LABEL[t.category]) ||
          t.category ||
          'Tool';
        var iconColor =
          t.category === 'calculator'
            ? 'var(--primary-400)'
            : t.category === 'simulator'
              ? 'var(--cyan-400)'
              : t.category === 'estimator'
                ? 'var(--success)'
                : 'var(--warning)';
        var badgeClass =
          t.category === 'calculator'
            ? 'badge-blue'
            : t.category === 'simulator'
              ? 'badge-cyan'
              : t.category === 'estimator'
                ? 'badge-green'
                : 'badge-orange';

        var acc = getToolAccess(t, userPlan);
        var hasAccess = acc.hasAccess;
        var planBadge = acc.planBadge;
        var actionBtn = acc.actionBtn;
        var titleLink = acc.titleLink;

        /* Lock badge for locked tools — corner icon, content stays readable */
        var lockOverlay = !hasAccess
          ? '<div class="rc-lock" style="position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:2;display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--warning);border-radius:var(--radius-full);padding:4px 10px 4px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)">' +
            '<svg width="13" height="13" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '<span style="font-size:.625rem;font-weight:700;color:var(--warning);white-space:nowrap">' +
            PLAN_LABEL[acc.toolPlan] +
            '</span>' +
            '</div>'
          : '';

        return (
          '<div class="resource-card card card-hover rv-item" data-category="' +
          (t.category || '') +
          '" data-searchable style="position:relative;overflow:hidden">' +
          lockOverlay +
          '<div style="display:flex;align-items:flex-start;gap:var(--sp-4)">' +
          '<div class="rc-icon" style="width:44px;height:44px;border-radius:var(--radius-md);background:rgba(37,99,235,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
          '<svg width="20" height="20" fill="none" stroke="' +
          iconColor +
          '" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>' +
          '</div>' +
          '<div class="rc-content" style="flex:1;min-width:0">' +
          '<div class="rc-meta" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:var(--sp-2)">' +
          '<span class="badge ' +
          badgeClass +
          '">' +
          catLabel +
          '</span>' +
          planBadge +
          '<span class="badge badge-gray content-views-chip" data-kind="tool" data-id="' +
          t.id +
          '">👁 0 views · 0 visitors</span>' +
          '<span class="badge badge-gray content-like-chip" data-kind="tool" data-id="' +
          t.id +
          '">♥ 0 likes</span>' +
          '</div>' +
          '<h3 class="rc-title" style="font-size:var(--text-sm);font-weight:var(--weight-semi);margin-bottom:var(--sp-2)">' +
          titleLink +
          '</h3>' +
          '<p style="font-size:var(--text-xs);color:var(--text-sub);margin-bottom:var(--sp-4)">' +
          (t.description || '') +
          '</p>' +
          actionBtn +
          '</div>' +
          '</div>' +
          '</div>'
        );
      }

      /* ── Table renderer (List view) — Title / Category / Views & Visitors
         / Likes / Action, one row per tool ─────────────────────────────── */
      function renderToolTableRow(t, userPlan) {
        var catLabel =
          (typeof CATEGORY_LABEL !== 'undefined' && CATEGORY_LABEL[t.category]) ||
          t.category ||
          'Tool';
        var badgeClass =
          t.category === 'calculator'
            ? 'badge-blue'
            : t.category === 'simulator'
              ? 'badge-cyan'
              : t.category === 'estimator'
                ? 'badge-green'
                : 'badge-orange';
        var acc = getToolAccess(t, userPlan);

        return (
          '<tr class="rv-item" data-category="' +
          (t.category || '') +
          '" data-searchable>' +
          '<td style="color:var(--text-base);font-weight:600">' +
          acc.titleLink +
          '</td>' +
          '<td><span class="badge ' +
          badgeClass +
          '">' +
          catLabel +
          '</span>' +
          acc.planBadge +
          '</td>' +
          '<td>' +
          '<span class="badge badge-gray content-views-chip" data-kind="tool" data-id="' +
          t.id +
          '">👁 0 views · 0 visitors</span>' +
          '</td>' +
          '<td>' +
          '<span class="badge badge-gray content-like-chip" data-kind="tool" data-id="' +
          t.id +
          '">♥ 0 likes</span>' +
          '</td>' +
          '<td>' +
          acc.actionBtn +
          '</td>' +
          '</tr>'
        );
      }

      function renderToolTable(tools, userPlan) {
        return (
          '<div class="table-wrap">' +
          '<table class="data-table rv-table">' +
          '<thead><tr>' +
          '<th>Title</th><th>Category</th><th>Views &amp; Visitors</th><th>Likes</th><th>Action</th>' +
          '</tr></thead>' +
          '<tbody>' +
          tools
            .map(function (t) {
              return renderToolTableRow(t, userPlan);
            })
            .join('') +
          '</tbody>' +
          '</table>' +
          '</div>'
        );
      }

      /* ── View switcher (Grid / List / Detail) ─────────────────────── */
      var _allTools = [];
      var _userPlan = 'basic';

      function renderToolsList() {
        var grid = document.getElementById('tools-grid');
        var empty = document.getElementById('tools-empty');
        if (!grid || !_allTools.length) return;
        var view = grid.classList.contains('rv-list')
          ? 'list'
          : grid.classList.contains('rv-detail')
            ? 'detail'
            : 'grid';
        grid.innerHTML =
          view === 'list'
            ? renderToolTable(_allTools, _userPlan)
            : _allTools
                .map(function (t) {
                  return renderToolCardWithAccess(t, _userPlan);
                })
                .join('');
        applyCurrentFilterAndSearch();
        if (typeof loadContentSocialChips === 'function') loadContentSocialChips('tool');
        if (empty) empty.style.display = 'none';
      }

      function applyToolsView(view) {
        var grid = document.getElementById('tools-grid');
        if (!grid) return;
        if (['grid', 'list', 'detail'].indexOf(view) === -1) view = 'grid';
        grid.classList.remove('rv-grid', 'rv-list', 'rv-detail');
        grid.classList.add('rv-' + view);
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-view') === view);
        });
        try {
          localStorage.setItem('re_tools_view', view);
        } catch (e) {
          /* ignore storage errors */
        }
        renderToolsList();
      }
      function wireToolsViewToggle() {
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            applyToolsView(b.getAttribute('data-view'));
          });
        });
        var stored = 'grid';
        try {
          stored = localStorage.getItem('re_tools_view') || 'grid';
        } catch (e) {
          stored = 'grid';
        }
        applyToolsView(stored);
      }

      /* ── Filter & search — works against whichever markup the current
         view rendered (cards or table rows), both tagged .rv-item ──────── */
      function applyCurrentFilterAndSearch() {
        var activeBtn = document.querySelector('.filter-pill.active');
        var f = activeBtn ? activeBtn.dataset.filter : 'all';
        var searchInput = document.querySelector('[data-search]');
        var q = searchInput ? searchInput.value.toLowerCase() : '';
        document.querySelectorAll('#tools-grid .rv-item').forEach(function (item) {
          var matchesFilter = f === 'all' || item.dataset.category === f;
          var matchesSearch = !q || item.textContent.toLowerCase().indexOf(q) !== -1;
          item.style.display = matchesFilter && matchesSearch ? '' : 'none';
        });
        checkToolsEmpty();
      }
      function checkToolsEmpty() {
        var empty = document.getElementById('tools-empty');
        if (!empty) return;
        var visible = document.querySelectorAll('#tools-grid .rv-item:not([style*="none"])').length;
        empty.style.display = visible === 0 ? 'block' : 'none';
      }
      function wireToolsFiltersAndSearch() {
        document.querySelectorAll('.filter-pill').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-pill').forEach(function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
            applyCurrentFilterAndSearch();
          });
        });
        var searchInput = document.querySelector('[data-search]');
        if (searchInput) {
          searchInput.addEventListener('input', applyCurrentFilterAndSearch);
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        var empty = document.getElementById('tools-empty');

        wireToolsViewToggle();
        wireToolsFiltersAndSearch();

        /* Fetch user subscription and tools in parallel */
        var toolsPromise = fetch('/api/tools')
          .then(function (r) {
            return r.json();
          })
          .catch(function () {
            return null;
          });

        var session = (function () {
          try {
            return JSON.parse(localStorage.getItem('re_session') || '{}');
          } catch (e) {
            return {};
          }
        })();
        var token = session.accessToken || session.token || '';

        var subPromise = token
          ? fetch('/api/subscription/status', { headers: { Authorization: 'Bearer ' + token } })
              .then(function (r) {
                return r.json();
              })
              .catch(function () {
                return null;
              })
          : Promise.resolve(null);

        Promise.all([toolsPromise, subPromise]).then(function (results) {
          var toolsRes = results[0];
          var subRes = results[1];

          /* Set user plan from subscription response */
          if (subRes && subRes.success && subRes.subscription) {
            _userPlan = subRes.subscription.planId || 'basic';
          }

          var tools =
            toolsRes && toolsRes.success && toolsRes.data && toolsRes.data.length
              ? toolsRes.data
              : getAllTools();
          _allTools = (tools || []).filter(function (t) {
            return t.status !== 'inactive';
          });
          if (_allTools.length === 0) {
            if (empty) empty.style.display = 'block';
            return;
          }
          renderToolsList();
        });
      });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
