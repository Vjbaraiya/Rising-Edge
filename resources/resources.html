<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <meta
      name="description"
      content="Rising Edge technical whitepapers, reference designs, and engineering guides."
    />
    <title>Resources | Rising Edge Technologies</title>
    <link rel="canonical" href="https://www.risingedgetech.com/resources/resources.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      .content-views-chip,
      .content-like-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* ── View switcher (Grid / List) ── */
      .view-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .view-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 34px;
        background: var(--bg-card);
        border: none;
        border-right: 1px solid var(--border);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .view-btn:last-child {
        border-right: none;
      }
      .view-btn:hover {
        background: var(--bg-hover);
        color: var(--text-base);
      }
      .view-btn.active {
        background: rgba(37, 99, 235, 0.12);
        color: var(--primary-400);
      }

      /* Detail view: one full-width card per row instead of a multi-column
         grid — same card markup as Grid, just given more room. */
      #resources-grid.rv-detail {
        display: flex;
        flex-direction: column;
        gap: var(--sp-4);
      }

      /* List view: a compact table — rendered directly as <table>, not the
         card markup (see renderResourceTable in the script below). */
      #resources-grid.rv-list {
        display: block;
      }
      .rv-table th:last-child,
      .rv-table td:last-child {
        text-align: right;
      }
      .rc-title-link {
        color: inherit;
        text-decoration: none;
      }
      .rc-title-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="global-nav"></div>

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../Index.html">Home</a><span>/</span><span>Resources</span>
        </nav>
        <div
          style="
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--sp-4);
          "
        >
          <div>
            <h1>Technical Resources</h1>
            <p style="color: var(--text-sub); margin-top: var(--sp-2)">
              Whitepapers, reference designs, and engineering guides — curated for hardware
              engineers.
            </p>
          </div>
          <a href="../Articles/articles.html" class="btn btn-outline btn-sm">Short articles →</a>
        </div>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <h2 class="sr-only">Browse all resources</h2>
        <div
          style="
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-3);
            align-items: center;
            margin-bottom: var(--sp-8);
          "
        >
          <div class="filter-pills" data-filter-group>
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="whitepaper">Whitepapers</button>
            <button class="filter-pill" data-filter="design">Reference Designs</button>
            <button class="filter-pill" data-filter="guide">Guides</button>
            <button class="filter-pill" data-filter="case-study">Case Studies</button>
            <button class="filter-pill" data-filter="myth-buster">Myth Busters</button>
          </div>
          <div class="view-toggle" role="group" aria-label="View mode" style="margin-left: auto">
            <button
              class="view-btn active"
              data-view="grid"
              title="Grid view"
              aria-label="Grid view"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
            </button>
            <button class="view-btn" data-view="list" title="List view" aria-label="List view">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
            <button
              class="view-btn"
              data-view="detail"
              title="Detail view"
              aria-label="Detail view"
            >
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="4" width="7" height="16" rx="1" />
                <line x1="13" y1="7" x2="21" y2="7" />
                <line x1="13" y1="12" x2="21" y2="12" />
                <line x1="13" y1="17" x2="18" y2="17" />
              </svg>
            </button>
          </div>
          <div class="search-wrap" style="max-width: 240px">
            <svg
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              class="input"
              type="search"
              placeholder="Search resources…"
              data-search
              aria-label="Search resources"
            />
          </div>
        </div>

        <div class="cards-grid" id="resources-grid">
          <!-- rendered by JS -->
        </div>

        <div
          id="resources-empty"
          style="
            display: none;
            text-align: center;
            padding: var(--sp-16) 0;
            color: var(--text-faint);
          "
        >
          No resources match your filter.
        </div>
      </div>
    </section>

    <div id="global-footer"></div>
    <div id="global-bottom-nav"></div>
    <script src="../assets/js/core.js"></script>
    <script>
      var PLAN_RANK = { basic: 0, advanced: 1, premium: 2 };
      var PLAN_LABEL = { basic: 'Basic', advanced: 'Advanced', premium: 'Premium' };

      var TYPE_BADGE = {
        whitepaper: 'badge-blue',
        design: 'badge-purple',
        guide: 'badge-green',
        'case-study': 'badge-orange',
        'myth-buster': 'badge-cyan',
      };
      var TYPE_LABEL_MAP = {
        whitepaper: 'Whitepaper',
        design: 'Reference Design',
        guide: 'Guide',
        'case-study': 'Case Study',
        'myth-buster': 'Myth Buster',
      };
      var TYPE_ICON_COLOR = {
        whitepaper: 'var(--primary-400)',
        design: 'var(--purple,#a855f7)',
        guide: 'var(--success)',
        'case-study': 'var(--warning)',
        'myth-buster': 'var(--cyan-400,#22d3ee)',
      };
      var TYPE_ICON_PATH = {
        whitepaper:
          '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
        design:
          '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
        guide: '<path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
        'case-study': '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
        'myth-buster':
          '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>',
      };

      function userCanAccess(resPlan, userPlan) {
        return (PLAN_RANK[userPlan] || 0) >= (PLAN_RANK[resPlan] || 0);
      }

      /* ── Shared access/action logic (grid, detail and table rows all use
         the same plan-gating rules) ───────────────────────────────────── */
      function getResourceAccess(r, userPlan) {
        var type = r.type || 'whitepaper';
        var resPlan = r.plan || 'basic';
        var hasAccess = userCanAccess(resPlan, userPlan);
        var isPaid = resPlan !== 'basic';

        var planBadge = isPaid
          ? '<span class="badge ' +
            (resPlan === 'premium' ? 'badge-purple' : 'badge-blue') +
            '" style="margin-left:var(--sp-2);font-size:.625rem">' +
            PLAN_LABEL[resPlan] +
            '</span>'
          : '';

        var actionBtn = hasAccess
          ? '<a href="' +
            (r.url || '#') +
            '" class="btn btn-secondary btn-sm rc-action"' +
            (r.url && r.url !== '#' ? ' target="_blank" rel="noopener"' : '') +
            " onclick=\"reRecordContentView('resource','" +
            r.id +
            '\')"' +
            '>' +
            (type === 'guide' ? 'Read Guide' : 'Download') +
            '</a>'
          : '<a href="../subscription/plans.html" class="btn btn-primary btn-sm rc-action">Upgrade to Access</a>';

        /* Title link — always the primary click target, but access-gated the
           same way the action button is: locked resources link to the plans
           page, never straight to the resource, so the compact list view
           can't be used to bypass the plan gate. */
        var titleHref = hasAccess ? r.url || '#' : '../subscription/plans.html';
        var titleExtra = hasAccess
          ? (r.url && r.url !== '#' ? ' target="_blank" rel="noopener"' : '') +
            " onclick=\"reRecordContentView('resource','" +
            r.id +
            '\')"'
          : '';
        var titleLink =
          '<a class="rc-title-link" href="' +
          titleHref +
          '"' +
          titleExtra +
          '>' +
          (r.title || '') +
          '</a>' +
          (!hasAccess
            ? ' <span title="' +
              PLAN_LABEL[resPlan] +
              ' plan required" style="font-size:0.75rem">🔒</span>'
            : '');

        return {
          type: type,
          resPlan: resPlan,
          hasAccess: hasAccess,
          planBadge: planBadge,
          actionBtn: actionBtn,
          titleLink: titleLink,
        };
      }

      function renderResourceCard(r, userPlan) {
        var acc = getResourceAccess(r, userPlan);
        var type = acc.type;
        var badge = TYPE_BADGE[type] || 'badge-gray';
        var label = TYPE_LABEL_MAP[type] || type;
        var iconColor = TYPE_ICON_COLOR[type] || 'var(--primary-400)';
        var iconPath = TYPE_ICON_PATH[type] || TYPE_ICON_PATH.whitepaper;
        var hasAccess = acc.hasAccess;
        var planBadge = acc.planBadge;
        var actionBtn = acc.actionBtn;
        var titleLink = acc.titleLink;

        var lockOverlay = !hasAccess
          ? '<div class="rc-lock" style="position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:2;display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--warning);border-radius:var(--radius-full);padding:4px 10px 4px 8px;box-shadow:0 1px 4px rgba(0,0,0,.15)">' +
            '<svg width="13" height="13" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '<span style="font-size:.625rem;font-weight:700;color:var(--warning);white-space:nowrap">' +
            PLAN_LABEL[acc.resPlan] +
            '</span>' +
            '</div>'
          : '';

        return (
          '<div class="resource-card card card-hover rv-item" data-category="' +
          type +
          '" data-searchable style="position:relative;overflow:hidden">' +
          lockOverlay +
          '<div style="display:flex;align-items:flex-start;gap:var(--sp-4)">' +
          '<div class="rc-icon" style="width:44px;height:44px;border-radius:var(--radius-md);background:rgba(37,99,235,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
          '<svg width="20" height="20" fill="none" stroke="' +
          iconColor +
          '" stroke-width="1.8" viewBox="0 0 24 24">' +
          iconPath +
          '</svg>' +
          '</div>' +
          '<div class="rc-content" style="flex:1;min-width:0">' +
          '<div class="rc-meta" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:var(--sp-2)">' +
          '<span class="badge ' +
          badge +
          '">' +
          label +
          '</span>' +
          planBadge +
          '<span class="badge badge-gray content-views-chip" data-kind="resource" data-id="' +
          r.id +
          '">👁 0 views · 0 visitors</span>' +
          '<span class="badge badge-gray content-like-chip" data-kind="resource" data-id="' +
          r.id +
          '">♥ 0 likes</span>' +
          '</div>' +
          '<h3 class="rc-title" style="font-size:var(--text-sm);font-weight:var(--weight-semi);margin-bottom:var(--sp-2)">' +
          titleLink +
          '</h3>' +
          '<p style="font-size:var(--text-xs);color:var(--text-sub);margin-bottom:var(--sp-4)">' +
          (r.description || '') +
          '</p>' +
          (r.downloads
            ? '<div class="rc-downloads" style="font-size:var(--text-xs);color:var(--text-muted);margin-bottom:var(--sp-3)">' +
              r.downloads +
              ' downloads</div>'
            : '') +
          actionBtn +
          '</div>' +
          '</div>' +
          '</div>'
        );
      }

      /* ── Table renderer (List view) — Title / Type / Views & Visitors /
         Likes / Action, one row per resource ──────────────────────────── */
      function renderResourceTableRow(r, userPlan) {
        var acc = getResourceAccess(r, userPlan);
        var type = acc.type;
        var badge = TYPE_BADGE[type] || 'badge-gray';
        var label = TYPE_LABEL_MAP[type] || type;

        return (
          '<tr class="rv-item" data-category="' +
          type +
          '" data-searchable>' +
          '<td style="color:var(--text-base);font-weight:600">' +
          acc.titleLink +
          '</td>' +
          '<td><span class="badge ' +
          badge +
          '">' +
          label +
          '</span>' +
          acc.planBadge +
          '</td>' +
          '<td>' +
          '<span class="badge badge-gray content-views-chip" data-kind="resource" data-id="' +
          r.id +
          '">👁 0 views · 0 visitors</span>' +
          '</td>' +
          '<td>' +
          '<span class="badge badge-gray content-like-chip" data-kind="resource" data-id="' +
          r.id +
          '">♥ 0 likes</span>' +
          '</td>' +
          '<td>' +
          acc.actionBtn +
          '</td>' +
          '</tr>'
        );
      }

      function renderResourceTable(resources, userPlan) {
        return (
          '<div class="table-wrap">' +
          '<table class="data-table rv-table">' +
          '<thead><tr>' +
          '<th>Title</th><th>Type</th><th>Views &amp; Visitors</th><th>Likes</th><th>Action</th>' +
          '</tr></thead>' +
          '<tbody>' +
          resources
            .map(function (r) {
              return renderResourceTableRow(r, userPlan);
            })
            .join('') +
          '</tbody>' +
          '</table>' +
          '</div>'
        );
      }

      /* ── View switcher (Grid / List / Detail) ─────────────────────── */
      var _allResources = [];
      var _userPlan = 'basic';

      function renderResourcesList() {
        var grid = document.getElementById('resources-grid');
        var empty = document.getElementById('resources-empty');
        if (!grid || !_allResources.length) return;
        var view = grid.classList.contains('rv-list')
          ? 'list'
          : grid.classList.contains('rv-detail')
            ? 'detail'
            : 'grid';
        grid.innerHTML =
          view === 'list'
            ? renderResourceTable(_allResources, _userPlan)
            : _allResources
                .map(function (r) {
                  return renderResourceCard(r, _userPlan);
                })
                .join('');
        applyCurrentFilterAndSearch();
        if (typeof loadContentSocialChips === 'function') loadContentSocialChips('resource');
        if (empty) empty.style.display = 'none';
      }

      function applyResourcesView(view) {
        var grid = document.getElementById('resources-grid');
        if (!grid) return;
        if (['grid', 'list', 'detail'].indexOf(view) === -1) view = 'grid';
        grid.classList.remove('rv-grid', 'rv-list', 'rv-detail');
        grid.classList.add('rv-' + view);
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-view') === view);
        });
        try {
          localStorage.setItem('re_resources_view', view);
        } catch (e) {
          /* ignore storage errors */
        }
        renderResourcesList();
      }
      function wireResourcesViewToggle() {
        document.querySelectorAll('.view-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            applyResourcesView(b.getAttribute('data-view'));
          });
        });
        var stored = 'grid';
        try {
          stored = localStorage.getItem('re_resources_view') || 'grid';
        } catch (e) {
          stored = 'grid';
        }
        applyResourcesView(stored);
      }

      /* ── Filter & search — works against whichever markup the current
         view rendered (cards or table rows), both tagged .rv-item ──────── */
      function applyCurrentFilterAndSearch() {
        var activeBtn = document.querySelector('.filter-pill.active');
        var f = activeBtn ? activeBtn.dataset.filter : 'all';
        var searchInput = document.querySelector('[data-search]');
        var q = searchInput ? searchInput.value.toLowerCase() : '';
        document.querySelectorAll('#resources-grid .rv-item').forEach(function (item) {
          var matchesFilter = f === 'all' || item.dataset.category === f;
          var matchesSearch = !q || item.textContent.toLowerCase().indexOf(q) !== -1;
          item.style.display = matchesFilter && matchesSearch ? '' : 'none';
        });
        checkResourcesEmpty();
      }
      function checkResourcesEmpty() {
        var empty = document.getElementById('resources-empty');
        if (!empty) return;
        var visible = document.querySelectorAll(
          '#resources-grid .rv-item:not([style*="none"])'
        ).length;
        empty.style.display = visible === 0 ? 'block' : 'none';
      }
      function wireResourcesFiltersAndSearch() {
        document.querySelectorAll('.filter-pill').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.filter-pill').forEach(function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
            applyCurrentFilterAndSearch();
          });
        });
        var searchInput = document.querySelector('[data-search]');
        if (searchInput) {
          searchInput.addEventListener('input', applyCurrentFilterAndSearch);
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        var empty = document.getElementById('resources-empty');

        wireResourcesViewToggle();
        wireResourcesFiltersAndSearch();

        /* Fetch resources and user subscription in parallel */
        var resPromise = fetch('/api/resources')
          .then(function (r) {
            return r.json();
          })
          .catch(function () {
            return null;
          });

        var session = (function () {
          try {
            return JSON.parse(localStorage.getItem('re_session') || '{}');
          } catch (e) {
            return {};
          }
        })();
        var token = session.accessToken || session.token || '';

        var subPromise = token
          ? fetch('/api/subscription/status', { headers: { Authorization: 'Bearer ' + token } })
              .then(function (r) {
                return r.json();
              })
              .catch(function () {
                return null;
              })
          : Promise.resolve(null);

        Promise.all([resPromise, subPromise]).then(function (results) {
          var resResult = results[0];
          var subRes = results[1];
          if (subRes && subRes.success && subRes.subscription) {
            _userPlan = subRes.subscription.planId || 'basic';
          }
          var resources = resResult && resResult.success && resResult.data ? resResult.data : [];
          _allResources = resources.filter(function (r) {
            return r.status !== 'inactive';
          });
          if (_allResources.length === 0) {
            if (empty) empty.style.display = 'block';
            return;
          }
          renderResourcesList();
        });
      });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
