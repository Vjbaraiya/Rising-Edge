name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_SECRET: test-ci-secret-at-least-32-chars-long
  DATABASE_URL: postgresql://user:pass@localhost:5432/rising_edge_test
  PORT: 0
  CASHFREE_ENV: sandbox
  APP_URL: http://localhost:8080

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Syntax check server.js
        run: node --check server.js

      - name: Syntax check lib/
        run: |
          for f in lib/**/*.js; do node --check "$f"; done

  # ── Unit tests ────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage --coverageReporters=text-summary,lcov

      - name: Upload coverage (unit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/

  # ── API tests ─────────────────────────────────────────────────────────────
  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api -- --coverage --coverageReporters=text-summary,lcov

      - name: Upload coverage (API)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: coverage/

  # ── E2E tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # E2E needs the real server running
    # Skip E2E if DATABASE_URL secret not configured (forks / dependabot PRs)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # Use real secrets in CI if available; fallback keeps the job from failing on forks
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/rising_edge_test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-ci-secret-at-least-32-chars-long' }}
      CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID || '' }}
      CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only for CI speed)
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── All-clear gate ────────────────────────────────────────────────────────
  # Required status check — merge is blocked until lint + unit + api all pass
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, unit, api]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.unit.result }}" != "success" ||
                "${{ needs.api.result  }}" != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
