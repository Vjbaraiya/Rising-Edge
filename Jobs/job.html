<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta
      name="description"
      content="Hardware engineering job opening at Rising Edge Jobs Board."
    />
    <title>Job Details | Rising Edge Technologies</title>
    <link rel="canonical" href="https://www.risingedgetech.com/Jobs/job.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <link rel="stylesheet" href="jobs.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="global-nav"></div>

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../index.html">Home</a><span>/</span><a href="index.html">Jobs</a><span>/</span
          ><span>Details</span>
        </nav>
      </div>
    </div>

    <section class="section" style="padding-top: 1rem">
      <div class="container" id="jd-main">
        <div style="margin-bottom: 1.25rem">
          <div id="jd-badges" class="jb-meta" style="margin-bottom: 10px"></div>
          <h1 id="jd-title" style="font-size: 1.8rem; font-weight: 800; line-height: 1.25">
            Loading…
          </h1>
          <p id="jd-company" style="color: var(--text-sub); margin-top: 4px"></p>
        </div>

        <div class="jb-detail-grid">
          <div>
            <div class="jb-desc" id="jd-desc"></div>
          </div>
          <aside class="jb-side">
            <div id="jd-side-rows"></div>
            <button class="btn btn-primary" id="jd-apply" style="width: 100%; margin-top: 14px">
              Loading…
            </button>

            <div id="jd-owner-actions" style="display: none; gap: 8px; margin-top: 10px">
              <button
                type="button"
                class="btn btn-outline"
                style="flex: 1"
                onclick="JobsBoard.goEditJob(JobsBoard.getCurrentJobId())"
              >
                Edit
              </button>
              <button
                type="button"
                class="btn btn-outline"
                style="flex: 1; color: var(--red, #ef4444)"
                onclick="JobsBoard.deleteJobFromDetail()"
              >
                Delete
              </button>
            </div>

            <div style="margin-top: 14px">
              <div
                style="
                  font-size: 0.72rem;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.04em;
                  margin-bottom: 8px;
                "
              >
                Share this job
              </div>
              <div id="jd-share" style="display: flex; gap: 8px; flex-wrap: wrap"></div>
            </div>

            <div id="jd-links" style="display: none; margin-top: 14px">
              <div
                style="
                  font-size: 0.72rem;
                  color: var(--text-muted);
                  text-transform: uppercase;
                  letter-spacing: 0.04em;
                  margin-bottom: 8px;
                "
              >
                Also posted on
              </div>
              <div id="jd-links-list"></div>
            </div>
            <p
              id="jd-login-hint"
              style="
                display: none;
                font-size: 0.75rem;
                color: var(--text-muted);
                text-align: center;
                margin-top: 8px;
              "
            >
              Browsing is free — you only need an account to apply.
            </p>
          </aside>
        </div>
      </div>
    </section>

    <!-- ── Apply Modal ─────────────────────────────────────────────── -->
    <div
      class="modal-overlay"
      id="modal-apply"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      "
    >
      <div
        class="modal"
        style="
          max-width: 480px;
          width: 100%;
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 14px;
          padding: 22px;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
          "
        >
          <h2 style="font-size: 1.1rem">Apply for this job</h2>
          <button class="btn btn-ghost btn-icon" onclick="JobsBoard.closeApplyModal()">✕</button>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 14px">
          Applying as <strong id="ap-name"></strong> (<span id="ap-email"></span>)
        </p>
        <div class="form-group">
          <label class="form-label">Resume *</label>
          <input
            class="input"
            id="ap-resume-file"
            type="file"
            accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          />
          <p style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px">
            Upload your resume — PDF, DOC or DOCX, up to 5 MB. It is emailed directly to the
            recruiter and is not stored on our servers.
          </p>
        </div>
        <div class="form-group" style="margin-top: 12px">
          <label class="form-label">Cover note (optional)</label>
          <textarea
            class="input"
            id="ap-note"
            rows="4"
            maxlength="2000"
            placeholder="Briefly tell the recruiter why you're a fit…"
            style="resize: vertical"
          ></textarea>
        </div>
        <p
          id="ap-error"
          style="display: none; color: var(--red, #ef4444); font-size: 0.8rem; margin-top: 10px"
        ></p>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px">
          <button class="btn btn-outline btn-sm" onclick="JobsBoard.closeApplyModal()">
            Cancel
          </button>
          <button
            class="btn btn-primary btn-sm"
            id="ap-submit"
            onclick="JobsBoard.submitApplication()"
          >
            Submit application
          </button>
        </div>
      </div>
    </div>

    <div id="global-footer"></div>

    <script src="../assets/js/core.js"></script>
    <script src="jobs.js"></script>
    <script>
      JobsBoard.initDetail();
    </script>
  </body>
</html>
