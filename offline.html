<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06b6d4" />
    <title>You're Offline — Rising Edge</title>
    <link rel="canonical" href="https://www.risingedgetech.com/offline.html" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <style>
      :root {
        --bg: #0a0e1a;
        --surface: #0f1426;
        --border: #1e293b;
        --cyan: #06b6d4;
        --text: #e2e8f0;
        --sub: #64748b;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(6, 182, 212, 0.1);
        border: 1.5px solid rgba(6, 182, 212, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
      }
      .icon-wrap svg {
        width: 48px;
        height: 48px;
        color: var(--cyan);
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.9375rem;
        color: var(--sub);
        line-height: 1.65;
        max-width: 360px;
        margin-bottom: 2.5rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 320px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        border: none;
        text-decoration: none;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--cyan);
        color: #0a0e1a;
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .tip {
        margin-top: 3rem;
        padding: 1rem 1.25rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.8125rem;
        color: var(--sub);
        max-width: 360px;
        line-height: 1.6;
      }
      .tip strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="icon-wrap">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <circle cx="12" cy="20" r="1" fill="currentColor" />
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      No internet connection right now. Some pages may still be available from your cache — or try
      again once you're back online.
    </p>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        Try again
      </button>
      <a class="btn btn-secondary" href="/">Go to home</a>
    </div>

    <div class="tip">
      <strong>Tip:</strong> Pages you've visited before are saved on your device and may load even
      without a connection.
    </div>
  </body>
</html>
