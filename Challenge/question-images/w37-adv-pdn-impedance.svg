<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">PDN Impedance — Anti-Resonance Peak</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">A cap's ESL parallel-resonates with the plane/next cap → impedance peak</text>
  <line x1="80" y1="330" x2="660" y2="330" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="80" y2="330" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="360" text-anchor="middle" font-size="11" fill="#94a3b8">Frequency →</text>
  <text x="52" y="215" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90 52 215)">|Z| impedance</text>
  <line x1="80" y1="255" x2="660" y2="255" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="248" font-size="10" fill="#86efac">Z target</text>
  <polyline points="100,150 180,285 250,150 320,120 430,150 520,158 620,168" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="330" y="112" font-size="10" fill="#fca5a5">single value → anti-resonance peak (over target)</text>
  <polyline points="100,160 175,285 250,258 325,285 400,258 470,285 540,260 620,285" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="330" y="308" font-size="10" fill="#7dd3fc">staggered values → stays below target</text>
  <g fill="#f59e0b"><circle cx="175" cy="285" r="3.5"/><circle cx="325" cy="285" r="3.5"/><circle cx="470" cy="285" r="3.5"/></g>
  <text x="175" y="302" text-anchor="middle" font-size="8" fill="#fbbf24">bulk SRF</text>
  <text x="325" y="276" text-anchor="middle" font-size="8" fill="#fbbf24">mid SRF</text>
  <text x="480" y="276" text-anchor="middle" font-size="8" fill="#fbbf24">HF SRF</text>
  <rect x="120" y="378" width="480" height="28" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="397" text-anchor="middle" font-size="11" fill="#cbd5e1">Fix: bulk + mid + small HF ceramics near the die so their SRFs overlap</text>
</svg>
