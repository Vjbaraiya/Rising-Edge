<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Synchronous Buck — Minimize the Hot Loop</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Cin → high-side FET → low-side FET carries the highest di/dt</text>

  <!-- Vin -->
  <text x="70" y="120" font-size="12" fill="#cbd5e1">Vin</text>
  <line x1="90" y1="130" x2="90" y2="300" stroke="#64748b" stroke-width="2"/>
  <!-- Cin -->
  <line x1="90" y1="150" x2="150" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="138" x2="150" y2="162" stroke="#f59e0b" stroke-width="3"/>
  <line x1="165" y1="138" x2="165" y2="162" stroke="#f59e0b" stroke-width="3"/>
  <line x1="165" y1="150" x2="230" y2="150" stroke="#64748b" stroke-width="2"/>
  <text x="157" y="128" text-anchor="middle" font-size="10" fill="#fbbf24">Cin (HF ceramic)</text>

  <!-- High side FET -->
  <rect x="200" y="150" width="60" height="40" rx="5" fill="#152238" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="175" text-anchor="middle" font-size="11" fill="#fca5a5">HS FET</text>
  <!-- switch node -->
  <line x1="230" y1="190" x2="230" y2="235" stroke="#64748b" stroke-width="2"/>
  <text x="245" y="218" font-size="10" fill="#a5b4fc">SW node</text>
  <!-- Low side FET -->
  <rect x="200" y="235" width="60" height="40" rx="5" fill="#152238" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="260" text-anchor="middle" font-size="11" fill="#fca5a5">LS FET</text>
  <line x1="230" y1="275" x2="230" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="90" y1="300" x2="640" y2="300" stroke="#22c55e" stroke-width="3"/>
  <text x="365" y="318" text-anchor="middle" font-size="10" fill="#86efac">GND return</text>

  <!-- HOT LOOP highlight -->
  <rect x="140" y="132" width="135" height="176" rx="10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="207" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">HOT LOOP — keep tiny!</text>
  <text x="207" y="370" text-anchor="middle" font-size="9" fill="#fca5a5">high di/dt → parasitic L → ringing + EMI</text>

  <!-- Inductor + output (low criticality) -->
  <line x1="230" y1="212" x2="430" y2="212" stroke="#64748b" stroke-width="2"/>
  <path d="M430 212 q10 -14 20 0 q10 -14 20 0 q10 -14 20 0" fill="none" stroke="#a5b4fc" stroke-width="3"/>
  <text x="460" y="196" text-anchor="middle" font-size="10" fill="#a5b4fc">L</text>
  <line x1="490" y1="212" x2="600" y2="212" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="212" x2="580" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="568" y1="238" x2="592" y2="238" stroke="#94a3b8" stroke-width="3"/>
  <line x1="568" y1="252" x2="592" y2="252" stroke="#94a3b8" stroke-width="3"/>
  <text x="580" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">Cout</text>
  <text x="620" y="216" font-size="12" fill="#cbd5e1">Vout</text>
  <text x="430" y="260" text-anchor="middle" font-size="9" fill="#64748b">smooth current — less critical loop</text>
</svg>
