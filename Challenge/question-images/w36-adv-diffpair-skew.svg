<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Intra-Pair Skew on a Differential Pair</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Length mismatch → common-mode conversion; fix with a serpentine match</text>

  <!-- Unmatched -->
  <text x="60" y="100" font-size="13" font-weight="700" fill="#fca5a5">MISMATCHED (skew)</text>
  <line x1="60" y1="130" x2="360" y2="130" stroke="#f59e0b" stroke-width="3"/>
  <text x="200" y="122" text-anchor="middle" font-size="10" fill="#fbbf24">P (shorter)</text>
  <path d="M60 165 L360 165" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <text x="200" y="185" text-anchor="middle" font-size="10" fill="#7dd3fc">N (longer — extra length)</text>
  <path d="M300 165 q8 -18 16 0 q8 -18 16 0" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <rect x="60" y="205" width="300" height="42" rx="6" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="210" y="231" text-anchor="middle" font-size="10" fill="#fca5a5">edges arrive at different times → common-mode noise + closed eye</text>

  <!-- Matched -->
  <text x="400" y="100" font-size="13" font-weight="700" fill="#86efac">LENGTH-MATCHED</text>
  <path d="M400 130 q14 -16 28 0 q14 -16 28 0 L660 130" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <text x="540" y="112" text-anchor="middle" font-size="10" fill="#fbbf24">P (serpentine adds length)</text>
  <line x1="400" y1="170" x2="660" y2="170" stroke="#38bdf8" stroke-width="3"/>
  <text x="540" y="190" text-anchor="middle" font-size="10" fill="#7dd3fc">N</text>
  <rect x="400" y="210" width="260" height="42" rx="6" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="530" y="236" text-anchor="middle" font-size="10" fill="#86efac">equal delay → clean differential, open eye</text>

  <!-- eye diagrams -->
  <text x="185" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">Eye (skewed)</text>
  <rect x="90" y="310" width="190" height="80" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <path d="M100 320 C140 385 150 385 185 350 C220 385 230 385 270 320" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M100 380 C140 315 150 315 185 350 C220 315 230 315 270 380" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <text x="530" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">Eye (matched)</text>
  <rect x="435" y="310" width="190" height="80" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <path d="M445 322 C480 322 490 378 530 378 C570 378 580 322 615 322" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M445 378 C480 378 490 322 530 322 C570 322 580 378 615 378" fill="none" stroke="#22c55e" stroke-width="1.5"/>
</svg>
