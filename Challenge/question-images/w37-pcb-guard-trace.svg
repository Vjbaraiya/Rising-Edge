<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Grounded Guard Trace — Stitch It!</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Only works if via-stitched to ground along its full length</text>
  <!-- noisy digital -->
  <line x1="80" y1="110" x2="640" y2="110" stroke="#ef4444" stroke-width="5"/>
  <text x="80" y="100" font-size="11" fill="#fca5a5">noisy digital line</text>
  <!-- guard trace -->
  <line x1="80" y1="210" x2="640" y2="210" stroke="#22c55e" stroke-width="6"/>
  <text x="80" y="200" font-size="11" fill="#86efac">grounded guard trace</text>
  <!-- stitching vias -->
  <g fill="#22d3ee">
    <circle cx="120" cy="210" r="6"/><circle cx="190" cy="210" r="6"/><circle cx="260" cy="210" r="6"/>
    <circle cx="330" cy="210" r="6"/><circle cx="400" cy="210" r="6"/><circle cx="470" cy="210" r="6"/>
    <circle cx="540" cy="210" r="6"/><circle cx="610" cy="210" r="6"/>
  </g>
  <text x="360" y="245" text-anchor="middle" font-size="9" fill="#7dd3fc">stitching vias to ground plane at close, regular intervals</text>
  <!-- victim analog -->
  <line x1="80" y1="300" x2="640" y2="300" stroke="#38bdf8" stroke-width="4"/>
  <text x="80" y="290" font-size="11" fill="#7dd3fc">sensitive analog (victim)</text>
  <!-- coupling shunted -->
  <path d="M300 118 q10 40 30 84" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <text x="345" y="170" font-size="10" fill="#fca5a5">coupled noise → shunted to GND</text>
  <rect x="120" y="345" width="480" height="46" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#cbd5e1">A floating or end-only-grounded guard can make coupling WORSE.</text>
  <text x="360" y="383" text-anchor="middle" font-size="10" fill="#94a3b8">It must be a true low-impedance ground the whole way.</text>
</svg>
