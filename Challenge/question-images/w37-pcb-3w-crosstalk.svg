<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">The 3W Rule — Crosstalk Spacing</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Center-to-center spacing ≥ 3 × trace width cuts coupling</text>
  <!-- too close -->
  <text x="180" y="100" text-anchor="middle" font-size="12" fill="#fca5a5" font-weight="700">Too close (high crosstalk)</text>
  <rect x="150" y="120" width="16" height="120" fill="#f59e0b"/>
  <rect x="190" y="120" width="16" height="120" fill="#38bdf8"/>
  <path d="M166 180 q12 0 24 0" stroke="#ef4444" stroke-width="2" fill="none"/>
  <text x="178" y="258" text-anchor="middle" font-size="9" fill="#94a3b8">W · gap≈W</text>
  <g stroke="#ef4444" stroke-width="1.5" opacity="0.7">
    <path d="M166 150 q14 -12 40 0" fill="none"/><path d="M166 210 q14 12 40 0" fill="none"/>
  </g>
  <text x="230" y="185" font-size="10" fill="#fca5a5">strong coupling</text>
  <!-- 3W spacing -->
  <text x="500" y="100" text-anchor="middle" font-size="12" fill="#86efac" font-weight="700">3W spacing (low crosstalk)</text>
  <rect x="410" y="120" width="16" height="120" fill="#f59e0b"/>
  <rect x="530" y="120" width="16" height="120" fill="#38bdf8"/>
  <line x1="418" y1="255" x2="538" y2="255" stroke="#22c55e" stroke-width="1.5"/>
  <text x="478" y="272" text-anchor="middle" font-size="9" fill="#86efac">center-to-center ≥ 3W</text>
  <text x="478" y="185" text-anchor="middle" font-size="10" fill="#86efac">weak coupling</text>
  <!-- note -->
  <rect x="120" y="340" width="480" height="50" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="362" text-anchor="middle" font-size="11" fill="#cbd5e1">Coupling falls off rapidly with separation — 3W is the common budget.</text>
  <text x="360" y="380" text-anchor="middle" font-size="10" fill="#94a3b8">For very sensitive nets: add a grounded guard trace or more spacing.</text>
</svg>
