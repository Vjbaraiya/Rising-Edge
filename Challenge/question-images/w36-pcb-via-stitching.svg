<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Ground Stitching Vias</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Tie ground layers together, suppress plane resonances, shorten edge returns</text>

  <!-- board outline -->
  <rect x="90" y="95" width="540" height="250" rx="10" fill="rgba(34,197,94,0.05)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="120" text-anchor="middle" font-size="11" fill="#86efac">ground pour (top &amp; inner layers)</text>

  <!-- edge stitching vias -->
  <g fill="#38bdf8">
    <!-- top edge -->
    <circle cx="120" cy="110" r="5"/><circle cx="160" cy="110" r="5"/><circle cx="200" cy="110" r="5"/><circle cx="240" cy="110" r="5"/><circle cx="280" cy="110" r="5"/><circle cx="320" cy="110" r="5"/><circle cx="360" cy="110" r="5"/><circle cx="400" cy="110" r="5"/><circle cx="440" cy="110" r="5"/><circle cx="480" cy="110" r="5"/><circle cx="520" cy="110" r="5"/><circle cx="560" cy="110" r="5"/><circle cx="600" cy="110" r="5"/>
    <!-- bottom edge -->
    <circle cx="120" cy="330" r="5"/><circle cx="160" cy="330" r="5"/><circle cx="200" cy="330" r="5"/><circle cx="240" cy="330" r="5"/><circle cx="280" cy="330" r="5"/><circle cx="320" cy="330" r="5"/><circle cx="360" cy="330" r="5"/><circle cx="400" cy="330" r="5"/><circle cx="440" cy="330" r="5"/><circle cx="480" cy="330" r="5"/><circle cx="520" cy="330" r="5"/><circle cx="560" cy="330" r="5"/><circle cx="600" cy="330" r="5"/>
    <!-- left/right edges -->
    <circle cx="120" cy="150" r="5"/><circle cx="120" cy="190" r="5"/><circle cx="120" cy="230" r="5"/><circle cx="120" cy="270" r="5"/><circle cx="120" cy="300" r="5"/>
    <circle cx="600" cy="150" r="5"/><circle cx="600" cy="190" r="5"/><circle cx="600" cy="230" r="5"/><circle cx="600" cy="270" r="5"/><circle cx="600" cy="300" r="5"/>
  </g>

  <!-- RF section ring -->
  <rect x="300" y="180" width="150" height="90" rx="8" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="375" y="228" text-anchor="middle" font-size="11" fill="#93c5fd">RF section</text>
  <g fill="#a5b4fc">
    <circle cx="310" cy="190" r="4"/><circle cx="345" cy="190" r="4"/><circle cx="380" cy="190" r="4"/><circle cx="415" cy="190" r="4"/><circle cx="440" cy="190" r="4"/>
    <circle cx="310" cy="260" r="4"/><circle cx="345" cy="260" r="4"/><circle cx="380" cy="260" r="4"/><circle cx="415" cy="260" r="4"/><circle cx="440" cy="260" r="4"/>
  </g>

  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#cbd5e1">Space vias &lt; 1/10–1/20 of the wavelength of the highest frequency of concern</text>
  <circle cx="150" cy="400" r="5" fill="#38bdf8"/>
  <text x="165" y="404" font-size="10" fill="#94a3b8">= stitching via (connects ground layers)</text>
</svg>
