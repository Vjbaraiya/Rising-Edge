<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Series (Source) Termination</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Rs + driver Zout ≈ Z0, placed at the driver pin</text>
  <!-- driver -->
  <rect x="60" y="150" width="90" height="70" rx="8" fill="#152238" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="105" y="182" text-anchor="middle" font-size="12" fill="#e2e8f0">Driver</text>
  <text x="105" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">Zout≈10Ω</text>
  <!-- series R -->
  <line x1="150" y1="185" x2="185" y2="185" stroke="#64748b" stroke-width="2"/>
  <rect x="185" y="173" width="54" height="24" rx="4" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="212" y="190" text-anchor="middle" font-size="11" fill="#fbbf24">Rs≈39Ω</text>
  <text x="212" y="163" text-anchor="middle" font-size="9" fill="#fbbf24">at driver pin</text>
  <!-- trace -->
  <line x1="239" y1="185" x2="560" y2="185" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#f59e0b">Z0 = 50 Ω trace</text>
  <!-- receiver -->
  <rect x="560" y="150" width="100" height="70" rx="8" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="610" y="182" text-anchor="middle" font-size="12" fill="#e2e8f0">Receiver</text>
  <text x="610" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">high-Z (open)</text>
  <!-- waveform note -->
  <rect x="120" y="255" width="480" height="120" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#94a3b8">Driver launches half-amplitude wave →</text>
  <polyline points="150,350 260,350 260,320 460,320 460,300 560,300" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="255" y="342" font-size="9" fill="#7dd3fc">½ V</text>
  <text x="470" y="315" font-size="9" fill="#86efac">full V after reflection, absorbed at source</text>
  <text x="360" y="368" text-anchor="middle" font-size="10" fill="#cbd5e1">No static current · ideal for point-to-point single load</text>
</svg>
