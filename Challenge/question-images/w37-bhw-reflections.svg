<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Reflections on an Unterminated Line</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Zsource ≪ Z0 and open receiver → overshoot &amp; ringing</text>
  <!-- driver -->
  <rect x="60" y="120" width="80" height="60" rx="8" fill="#152238" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#e2e8f0">Driver</text>
  <text x="100" y="167" text-anchor="middle" font-size="9" fill="#94a3b8">low Z</text>
  <line x1="140" y1="150" x2="560" y2="150" stroke="#f59e0b" stroke-width="4"/>
  <text x="350" y="141" text-anchor="middle" font-size="11" fill="#f59e0b">Z0 = 50 Ω</text>
  <rect x="560" y="120" width="90" height="60" rx="8" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="605" y="150" text-anchor="middle" font-size="11" fill="#e2e8f0">Receiver</text>
  <text x="605" y="167" text-anchor="middle" font-size="9" fill="#94a3b8">open</text>
  <!-- waveforms -->
  <rect x="80" y="210" width="560" height="180" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#94a3b8">Receiver waveform</text>
  <line x1="110" y1="360" x2="620" y2="360" stroke="#334155"/>
  <line x1="110" y1="300" x2="620" y2="300" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3"/><text x="626" y="303" font-size="9" fill="#86efac">Vdd</text>
  <!-- unterminated ringing -->
  <polyline points="110,360 250,360 250,270 300,320 340,285 375,312 410,297 620,300" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="262" font-size="9" fill="#fca5a5">overshoot + ringing (no termination)</text>
  <!-- terminated clean -->
  <polyline points="110,362 255,362 280,302 620,302" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="470" y="345" text-anchor="middle" font-size="9" fill="#7dd3fc">with series R at driver: clean edge</text>
</svg>
