<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Serpentine Length Matching</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Equalize propagation delay so signals arrive within the skew budget</text>

  <!-- driver block -->
  <rect x="40" y="130" width="70" height="170" rx="8" fill="#152238" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="220" text-anchor="middle" font-size="11" fill="#93c5fd" transform="rotate(-90 75 220)">Source</text>

  <!-- receiver block -->
  <rect x="610" y="130" width="70" height="170" rx="8" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="645" y="220" text-anchor="middle" font-size="11" fill="#86efac" transform="rotate(-90 645 220)">Receiver</text>

  <!-- trace 0: straight (reference longest) -->
  <line x1="110" y1="150" x2="610" y2="150" stroke="#f59e0b" stroke-width="3"/>
  <text x="360" y="142" text-anchor="middle" font-size="9" fill="#fbbf24">D0 (longest — reference)</text>

  <!-- trace 1: small serpentine -->
  <path d="M110 190 L300 190 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 L610 190" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="360" y="212" text-anchor="middle" font-size="9" fill="#7dd3fc">D1 (small accordion added)</text>

  <!-- trace 2: larger serpentine -->
  <path d="M110 250 L250 250 q9 -16 18 0 q9 16 18 0 q9 -16 18 0 q9 16 18 0 q9 -16 18 0 q9 16 18 0 q9 -16 18 0 q9 16 18 0 L610 250" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <text x="360" y="272" text-anchor="middle" font-size="9" fill="#c4b5fd">D2 (largest accordion — shortest raw route)</text>

  <!-- annotation -->
  <rect x="150" y="310" width="420" height="70" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">All electrical lengths ≈ equal → skew within budget</text>
  <text x="360" y="358" text-anchor="middle" font-size="10" fill="#94a3b8">Parallel bus: data aligns to clock · Diff pair: avoids common-mode conversion</text>
  <text x="360" y="374" text-anchor="middle" font-size="9" fill="#64748b">Keep serpentine bends gentle to limit impedance discontinuity</text>
</svg>
