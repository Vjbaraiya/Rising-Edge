<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Power-QFN Thermal Via Array</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Exposed pad + via array → inner/bottom copper spreads heat</text>
  <!-- package -->
  <rect x="250" y="90" width="220" height="60" rx="6" fill="#152238" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="126" text-anchor="middle" font-size="12" fill="#e2e8f0">Power QFN — junction (several W)</text>
  <!-- exposed pad -->
  <rect x="270" y="150" width="180" height="18" fill="#f59e0b"/>
  <text x="360" y="163" text-anchor="middle" font-size="10" fill="#0b1220" font-weight="700">exposed pad (solid to top plane)</text>
  <!-- via array -->
  <g fill="#22d3ee">
    <rect x="285" y="168" width="10" height="120"/><rect x="315" y="168" width="10" height="120"/>
    <rect x="345" y="168" width="10" height="120"/><rect x="375" y="168" width="10" height="120"/>
    <rect x="405" y="168" width="10" height="120"/><rect x="430" y="168" width="10" height="120"/>
  </g>
  <text x="500" y="230" font-size="10" fill="#7dd3fc">thermal via array</text>
  <text x="500" y="246" font-size="9" fill="#94a3b8">filled/capped to avoid</text>
  <text x="500" y="260" font-size="9" fill="#94a3b8">solder wicking &amp; voids</text>
  <!-- copper planes -->
  <rect x="150" y="288" width="420" height="12" fill="#22c55e"/><text x="360" y="298" text-anchor="middle" font-size="9" fill="#0b1220">inner copper plane (heat spreader)</text>
  <rect x="150" y="316" width="420" height="12" fill="#22c55e"/><text x="360" y="326" text-anchor="middle" font-size="9" fill="#0b1220">bottom copper plane</text>
  <!-- heat arrows -->
  <g stroke="#ef4444" stroke-width="2" opacity="0.8"><line x1="360" y1="170" x2="360" y2="286" marker-end="url(#a)"/></g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#ef4444"/></marker></defs>
  <rect x="120" y="360" width="480" height="30" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="380" text-anchor="middle" font-size="11" fill="#cbd5e1">Flood pad solid (not thermal-relief) → lowest junction-to-ambient Rθ</text>
</svg>
