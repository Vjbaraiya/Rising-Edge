<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Clock Domain Crossing — Two-Flip-Flop Synchronizer</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">An asynchronous signal sampled without a synchronizer can go metastable</text>

  <!-- Source domain -->
  <rect x="40" y="110" width="150" height="180" rx="10" fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="115" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd">CLOCK DOMAIN A</text>
  <rect x="70" y="160" width="90" height="60" rx="6" fill="#152238" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="188" text-anchor="middle" font-size="12" fill="#e2e8f0">FF (src)</text>
  <text x="115" y="205" text-anchor="middle" font-size="10" fill="#94a3b8">clk_a</text>

  <!-- crossing signal -->
  <line x1="160" y1="185" x2="300" y2="185" stroke="#f59e0b" stroke-width="3"/>
  <text x="230" y="176" text-anchor="middle" font-size="10" fill="#fbbf24">async data</text>

  <!-- Dest domain -->
  <rect x="300" y="110" width="380" height="180" rx="10" fill="rgba(34,197,94,0.06)" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#86efac">CLOCK DOMAIN B (clk_b)</text>

  <rect x="330" y="160" width="90" height="60" rx="6" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="375" y="185" text-anchor="middle" font-size="12" fill="#e2e8f0">FF1</text>
  <text x="375" y="203" text-anchor="middle" font-size="9" fill="#ef4444">may be metastable</text>

  <line x1="420" y1="190" x2="500" y2="190" stroke="#64748b" stroke-width="2.5"/>

  <rect x="500" y="160" width="90" height="60" rx="6" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="545" y="185" text-anchor="middle" font-size="12" fill="#e2e8f0">FF2</text>
  <text x="545" y="203" text-anchor="middle" font-size="9" fill="#86efac">settled / clean</text>

  <line x1="590" y1="190" x2="655" y2="190" stroke="#22c55e" stroke-width="2.5"/>
  <text x="623" y="181" text-anchor="middle" font-size="10" fill="#86efac">safe</text>

  <!-- metastable waveform -->
  <text x="70" y="330" font-size="11" fill="#94a3b8">FF1 output on a bad sample:</text>
  <polyline points="70,370 130,370 130,345 150,345 160,360 170,348 180,358 200,352 210,345 260,345 260,370 330,370" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="185" y="392" text-anchor="middle" font-size="9" fill="#fca5a5">indeterminate settling</text>

  <text x="430" y="330" font-size="11" fill="#94a3b8">FF2 output after 1 clk_b period:</text>
  <polyline points="430,370 520,370 520,345 660,345" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="392" text-anchor="middle" font-size="9" fill="#86efac">resolved to valid logic level</text>
</svg>
