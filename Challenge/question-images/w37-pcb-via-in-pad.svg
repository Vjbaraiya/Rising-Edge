<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Via-in-Pad — Fill &amp; Cap (VIPPO)</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Open via wicks solder; filled+capped keeps a solid joint</text>
  <!-- BAD: open via -->
  <text x="185" y="100" text-anchor="middle" font-size="12" fill="#fca5a5" font-weight="700">Open via-in-pad (bad)</text>
  <rect x="120" y="120" width="130" height="16" fill="#f59e0b"/><text x="185" y="132" text-anchor="middle" font-size="9" fill="#0b1220">pad</text>
  <rect x="176" y="136" width="18" height="120" fill="none" stroke="#ef4444" stroke-width="2"/>
  <!-- solder ball wicked -->
  <path d="M150 118 q35 -30 70 0" fill="rgba(148,163,184,0.35)" stroke="#94a3b8"/>
  <path d="M176 136 l0 90 l18 0 l0 -90" fill="rgba(148,163,184,0.25)"/>
  <text x="270" y="180" font-size="10" fill="#fca5a5">solder wicks down</text>
  <text x="270" y="196" font-size="10" fill="#fca5a5">→ starved joint / void</text>
  <!-- GOOD: filled + capped -->
  <text x="520" y="100" text-anchor="middle" font-size="12" fill="#86efac" font-weight="700">Filled &amp; capped (VIPPO)</text>
  <rect x="455" y="120" width="130" height="16" fill="#f59e0b"/><text x="520" y="132" text-anchor="middle" font-size="9" fill="#0b1220">pad (flat)</text>
  <rect x="511" y="136" width="18" height="120" fill="#334155" stroke="#22c55e" stroke-width="2"/>
  <rect x="511" y="130" width="18" height="10" fill="#f59e0b"/>
  <text x="600" y="180" font-size="10" fill="#86efac">epoxy-filled,</text>
  <text x="600" y="196" font-size="10" fill="#86efac">capped &amp; plated flat</text>
  <path d="M470 118 q50 -26 100 0" fill="rgba(52,211,153,0.3)" stroke="#22c55e"/>
  <text x="520" y="112" text-anchor="middle" font-size="9" fill="#86efac">full solid solder joint</text>
  <rect x="120" y="330" width="480" height="46" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#cbd5e1">Enables tight fan-out on fine-pitch BGAs — at added fab cost.</text>
  <text x="360" y="369" text-anchor="middle" font-size="10" fill="#94a3b8">Fill (conductive/non-conductive) → cap → plate flat.</text>
</svg>
