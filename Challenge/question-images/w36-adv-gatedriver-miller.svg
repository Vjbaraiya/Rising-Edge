<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Miller-Induced Turn-On in a Half-Bridge</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Fast dV/dt couples through Cgd of the OFF FET → false turn-on / shoot-through</text>

  <!-- Vbus -->
  <text x="60" y="105" font-size="12" fill="#cbd5e1">V+</text>
  <line x1="70" y1="115" x2="70" y2="140" stroke="#64748b" stroke-width="2"/>
  <!-- HS FET -->
  <rect x="40" y="140" width="70" height="46" rx="5" fill="#152238" stroke="#22c55e" stroke-width="2"/>
  <text x="75" y="168" text-anchor="middle" font-size="11" fill="#86efac">HS (turns on)</text>
  <!-- switch node -->
  <line x1="75" y1="186" x2="75" y2="230" stroke="#f59e0b" stroke-width="3"/>
  <text x="90" y="212" font-size="11" fill="#fbbf24">SW ↑ fast dV/dt</text>

  <!-- LS FET with Cgd -->
  <rect x="40" y="230" width="70" height="46" rx="5" fill="#152238" stroke="#ef4444" stroke-width="2"/>
  <text x="75" y="252" text-anchor="middle" font-size="11" fill="#fca5a5">LS (should</text>
  <text x="75" y="266" text-anchor="middle" font-size="11" fill="#fca5a5">stay OFF)</text>
  <line x1="75" y1="276" x2="75" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="40" y1="300" x2="640" y2="300" stroke="#22c55e" stroke-width="3"/>
  <text x="360" y="318" text-anchor="middle" font-size="10" fill="#86efac">GND</text>

  <!-- Cgd coupling -->
  <path d="M75 210 C170 200 190 240 150 253" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="200" y="205" font-size="11" fill="#fbbf24">i = Cgd·dV/dt</text>
  <line x1="150" y1="248" x2="150" y2="258" stroke="#f59e0b" stroke-width="3"/>
  <line x1="162" y1="248" x2="162" y2="258" stroke="#f59e0b" stroke-width="3"/>
  <text x="156" y="240" text-anchor="middle" font-size="10" fill="#fbbf24">Cgd</text>

  <!-- gate node + driver -->
  <line x1="40" y1="253" x2="20" y2="253" stroke="#64748b" stroke-width="2"/>
  <text x="30" y="245" text-anchor="middle" font-size="9" fill="#94a3b8">gate</text>

  <!-- Vgs rising above Vth waveform -->
  <rect x="300" y="120" width="360" height="150" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="480" y="140" text-anchor="middle" font-size="11" fill="#94a3b8">LS gate voltage during HS turn-on</text>
  <line x1="320" y1="230" x2="640" y2="230" stroke="#334155" stroke-width="1"/>
  <line x1="320" y1="185" x2="640" y2="185" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="648" y="188" font-size="9" fill="#fca5a5">Vth</text>
  <!-- high impedance gate: rises above Vth -->
  <polyline points="320,230 420,230 445,170 470,205 520,225 640,229" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="455" y="162" text-anchor="middle" font-size="9" fill="#fca5a5">high-Z gate → false turn-on</text>
  <!-- low impedance / clamp: stays low -->
  <polyline points="320,232 420,232 448,222 470,231 640,232" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="250" text-anchor="middle" font-size="9" fill="#86efac">strong pull-down / Miller clamp → stays OFF</text>

  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#cbd5e1">Fixes: low-impedance off-state pull-down · negative gate bias · active Miller clamp</text>
</svg>
