<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Trace Crossing a Reference-Plane Split</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Return current must detour around the gap → loop inductance, ringing, EMI</text>

  <!-- top layer signal trace -->
  <text x="70" y="108" font-size="12" fill="#cbd5e1">TOP LAYER — signal trace</text>
  <line x1="80" y1="130" x2="640" y2="130" stroke="#f59e0b" stroke-width="5"/>
  <circle cx="80" cy="130" r="5" fill="#f59e0b"/>
  <circle cx="640" cy="130" r="5" fill="#f59e0b"/>
  <text x="60" y="134" text-anchor="end" font-size="10" fill="#fbbf24">drv</text>

  <!-- reference plane below, with split -->
  <text x="70" y="195" font-size="12" fill="#cbd5e1">LAYER BELOW — ground plane (split)</text>
  <rect x="80" y="210" width="270" height="70" fill="#134e2a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="370" y="210" width="270" height="70" fill="#134e2a" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="350" y="205" width="20" height="80" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="300" text-anchor="middle" font-size="10" fill="#fca5a5">split (isolated regions)</text>

  <!-- return current wants to be under trace but must detour -->
  <path d="M120 245 L340 245" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <path d="M340 245 C340 200 300 190 360 175 C420 190 380 200 380 245 L600 245" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <text x="360" y="168" text-anchor="middle" font-size="10" fill="#fca5a5">forced detour → large loop area</text>
  <text x="200" y="238" text-anchor="middle" font-size="9" fill="#7dd3fc">ideal return under trace</text>

  <!-- consequence box -->
  <rect x="120" y="325" width="480" height="60" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">↑ loop inductance → ringing + radiated EMI</text>
  <text x="360" y="372" text-anchor="middle" font-size="10" fill="#94a3b8">Fix: route over continuous copper, or add a stitching cap/via at the crossing</text>
</svg>
