<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Pierce Oscillator — Margin &amp; Drive Level</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Negative-resistance margin for start-up · drive level for reliability</text>
  <!-- inverter -->
  <polygon points="120,150 120,230 190,190" fill="#152238" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="196" cy="190" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="#e2e8f0">gain</text>
  <line x1="90" y1="190" x2="120" y2="190" stroke="#64748b" stroke-width="2"/>
  <line x1="201" y1="190" x2="240" y2="190" stroke="#64748b" stroke-width="2"/>
  <!-- feedback R -->
  <rect x="130" y="115" width="60" height="18" rx="3" fill="#0b1220" stroke="#94a3b8"/><text x="160" y="128" text-anchor="middle" font-size="9" fill="#cbd5e1">Rf</text>
  <line x1="90" y1="190" x2="90" y2="124" stroke="#64748b" stroke-width="1.5"/><line x1="90" y1="124" x2="130" y2="124" stroke="#64748b" stroke-width="1.5"/>
  <line x1="190" y1="124" x2="240" y2="124" stroke="#64748b" stroke-width="1.5"/><line x1="240" y1="124" x2="240" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <!-- crystal -->
  <line x1="240" y1="190" x2="300" y2="190" stroke="#64748b" stroke-width="2"/>
  <rect x="300" y="170" width="70" height="40" rx="4" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="335" y="188" text-anchor="middle" font-size="11" fill="#fbbf24">XTAL</text>
  <text x="335" y="202" text-anchor="middle" font-size="8" fill="#94a3b8">ESR</text>
  <line x1="370" y1="190" x2="430" y2="190" stroke="#64748b" stroke-width="2"/>
  <!-- damping Rd -->
  <rect x="385" y="160" width="30" height="14" rx="3" fill="#0b1220" stroke="#f59e0b"/><text x="400" y="152" text-anchor="middle" font-size="8" fill="#fbbf24">Rd (drive)</text>
  <!-- load caps -->
  <line x1="90" y1="190" x2="90" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <line x1="78" y1="260" x2="102" y2="260" stroke="#94a3b8" stroke-width="3"/><line x1="78" y1="270" x2="102" y2="270" stroke="#94a3b8" stroke-width="3"/>
  <text x="60" y="270" text-anchor="middle" font-size="9" fill="#cbd5e1">CL1</text>
  <line x1="430" y1="190" x2="430" y2="260" stroke="#64748b" stroke-width="1.5"/>
  <line x1="418" y1="260" x2="442" y2="260" stroke="#94a3b8" stroke-width="3"/><line x1="418" y1="270" x2="442" y2="270" stroke="#94a3b8" stroke-width="3"/>
  <text x="460" y="270" text-anchor="middle" font-size="9" fill="#cbd5e1">CL2</text>
  <line x1="90" y1="285" x2="430" y2="285" stroke="#22c55e" stroke-width="2"/>
  <!-- notes -->
  <rect x="500" y="150" width="200" height="150" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="600" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#f1f5f9">Two must-check params</text>
  <text x="512" y="200" font-size="10" fill="#86efac">✓ Neg-R margin ≥ ~5× ESR</text>
  <text x="512" y="216" font-size="9" fill="#94a3b8">   too low → cold no-start</text>
  <text x="512" y="242" font-size="10" fill="#fbbf24">✓ Drive level &lt; XTAL max</text>
  <text x="512" y="258" font-size="9" fill="#94a3b8">   too high → warm/aging</text>
  <text x="512" y="284" font-size="9" fill="#cbd5e1">Set by CL, Rd, amp gain</text>
</svg>
