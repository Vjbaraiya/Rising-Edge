<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Via Stub Resonance &amp; Back-Drilling</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Unused via barrel = resonant stub → notch in insertion loss</text>
  <!-- board cross-section -->
  <rect x="120" y="90" width="200" height="240" rx="6" fill="rgba(148,163,184,0.06)" stroke="#334155"/>
  <text x="220" y="82" text-anchor="middle" font-size="10" fill="#94a3b8">board cross-section</text>
  <!-- layers -->
  <line x1="120" y1="120" x2="320" y2="120" stroke="#22c55e" stroke-width="3"/><text x="330" y="124" font-size="9" fill="#86efac">top (signal in)</text>
  <line x1="120" y1="180" x2="320" y2="180" stroke="#22c55e" stroke-width="3"/><text x="330" y="184" font-size="9" fill="#86efac">inner (signal out)</text>
  <line x1="120" y1="300" x2="320" y2="300" stroke="#22c55e" stroke-width="3"/><text x="330" y="304" font-size="9" fill="#86efac">bottom</text>
  <!-- via -->
  <rect x="205" y="120" width="12" height="60" fill="#f59e0b"/>
  <rect x="205" y="180" width="12" height="120" fill="#ef4444"/>
  <text x="250" y="150" font-size="10" fill="#fbbf24">used</text>
  <text x="250" y="245" font-size="10" fill="#fca5a5">unused STUB</text>
  <!-- backdrill -->
  <path d="M211 300 L211 210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="150" y="345" font-size="9" fill="#7dd3fc">back-drill removes red stub →</text>
  <!-- freq response -->
  <rect x="400" y="100" width="290" height="230" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="545" y="122" text-anchor="middle" font-size="11" fill="#94a3b8">Insertion loss vs frequency</text>
  <line x1="425" y1="300" x2="670" y2="300" stroke="#334155"/>
  <polyline points="430,150 500,155 560,175 590,255 620,180 670,185" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="595" y="275" text-anchor="middle" font-size="9" fill="#fca5a5">resonant null (¼-wave stub)</text>
  <polyline points="430,150 520,158 600,168 670,178" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="560" y="150" text-anchor="middle" font-size="9" fill="#86efac">after back-drill: smooth</text>
</svg>
