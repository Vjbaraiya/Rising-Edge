<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">PDN Impedance vs. Frequency — Single Capacitor Value</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">A frequency gap between bulk and plane capacitance creates an anti-resonance peak</text>

  <!-- Anti-resonance highlight band (behind everything else) -->
  <rect x="300" y="100" width="100" height="240" fill="rgba(239,68,68,0.12)"/>

  <!-- Target impedance line -->
  <line x1="90" y1="280" x2="660" y2="280" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="655" y="274" text-anchor="end" font-size="11" fill="#34d399">Target Z (25 m&#8486;)</text>

  <!-- Axes -->
  <line x1="90" y1="100" x2="90" y2="340" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="340" x2="660" y2="340" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="220" text-anchor="middle" font-size="12" fill="#94a3b8" transform="rotate(-90 40 220)">Impedance (Z)</text>
  <text x="375" y="372" text-anchor="middle" font-size="12" fill="#94a3b8">Frequency &#8594;</text>

  <!-- Impedance curve -->
  <path d="M90,160 L220,300 L350,150 L430,300 L560,260 L660,180" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Dip annotations -->
  <text x="220" y="318" text-anchor="middle" font-size="11" fill="#94a3b8">bulk caps effective</text>
  <text x="430" y="318" text-anchor="middle" font-size="11" fill="#94a3b8">mid-value ceramics</text>

  <!-- Peak marker -->
  <circle cx="350" cy="150" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="350" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#f87171">Anti-resonance peak</text>

  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#64748b">Fix: stagger capacitor values/packages so their self-resonant frequencies overlap, eliminating the impedance gap.</text>
</svg>
