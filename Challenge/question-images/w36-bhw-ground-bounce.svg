<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Ground Bounce from Simultaneous Switching</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Return di/dt through lead/bond inductance lifts the die's internal ground</text>

  <!-- chip -->
  <rect x="120" y="110" width="240" height="180" rx="10" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd">LOGIC IC (die)</text>
  <text x="240" y="152" text-anchor="middle" font-size="10" fill="#94a3b8">internal ground = Vgnd_die</text>

  <!-- several switching outputs -->
  <g fill="#152238" stroke="#f59e0b" stroke-width="1.5">
    <rect x="150" y="170" width="50" height="26" rx="4"/>
    <rect x="150" y="205" width="50" height="26" rx="4"/>
    <rect x="150" y="240" width="50" height="26" rx="4"/>
  </g>
  <text x="175" y="188" text-anchor="middle" font-size="9" fill="#fbbf24">out↓</text>
  <text x="175" y="223" text-anchor="middle" font-size="9" fill="#fbbf24">out↓</text>
  <text x="175" y="258" text-anchor="middle" font-size="9" fill="#fbbf24">out↓</text>
  <text x="230" y="200" font-size="10" fill="#fbbf24">many switch H→L together</text>

  <!-- quiet output -->
  <rect x="280" y="205" width="60" height="26" rx="4" fill="#152238" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="223" text-anchor="middle" font-size="9" fill="#fca5a5">quiet LOW</text>
  <text x="310" y="248" text-anchor="middle" font-size="9" fill="#ef4444">glitches HIGH</text>

  <!-- ground lead inductance -->
  <line x1="240" y1="290" x2="240" y2="320" stroke="#64748b" stroke-width="2"/>
  <path d="M240 320 q-12 8 0 16 q12 8 0 16 q-12 8 0 16" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="285" y="345" font-size="11" fill="#fbbf24">L (bond wire /</text>
  <text x="285" y="360" font-size="11" fill="#fbbf24">lead inductance)</text>
  <line x1="240" y1="368" x2="240" y2="390" stroke="#64748b" stroke-width="2"/>
  <line x1="120" y1="390" x2="500" y2="390" stroke="#22c55e" stroke-width="3"/>
  <text x="310" y="384" text-anchor="middle" font-size="9" fill="#86efac">board GND (true 0 V)</text>

  <!-- formula + waveform -->
  <rect x="420" y="120" width="250" height="140" rx="8" fill="#0b1220" stroke="#1f2a44"/>
  <text x="545" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">V = L · di/dt</text>
  <text x="545" y="176" text-anchor="middle" font-size="10" fill="#94a3b8">large combined return current</text>
  <text x="545" y="192" text-anchor="middle" font-size="10" fill="#94a3b8">→ die ground momentarily &gt; 0 V</text>
  <polyline points="440,240 500,240 512,210 528,238 545,222 560,238 650,238" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="545" y="255" text-anchor="middle" font-size="9" fill="#fca5a5">Vgnd_die bounce</text>
</svg>
