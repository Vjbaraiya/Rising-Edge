<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">DDR Fly-by Topology vs T-Topology</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Fly-by = one terminated line; skew corrected by write leveling</text>

  <!-- Fly-by -->
  <text x="60" y="100" font-size="13" font-weight="700" fill="#86efac">FLY-BY (preferred)</text>
  <rect x="40" y="120" width="70" height="46" rx="6" fill="#152238" stroke="#22c55e" stroke-width="1.5"/>
  <text x="75" y="148" text-anchor="middle" font-size="11" fill="#e2e8f0">Controller</text>
  <!-- main line -->
  <line x1="110" y1="143" x2="640" y2="143" stroke="#f59e0b" stroke-width="4"/>
  <!-- short stubs to DRAMs -->
  <g fill="#152238" stroke="#3b82f6" stroke-width="1.5">
    <rect x="170" y="165" width="60" height="40" rx="5"/>
    <rect x="290" y="165" width="60" height="40" rx="5"/>
    <rect x="410" y="165" width="60" height="40" rx="5"/>
    <rect x="530" y="165" width="60" height="40" rx="5"/>
  </g>
  <g stroke="#3b82f6" stroke-width="2">
    <line x1="200" y1="143" x2="200" y2="165"/>
    <line x1="320" y1="143" x2="320" y2="165"/>
    <line x1="440" y1="143" x2="440" y2="165"/>
    <line x1="560" y1="143" x2="560" y2="165"/>
  </g>
  <g fill="#93c5fd" font-size="10" text-anchor="middle">
    <text x="200" y="189">DRAM1</text><text x="320" y="189">DRAM2</text>
    <text x="440" y="189">DRAM3</text><text x="560" y="189">DRAM4</text>
  </g>
  <!-- termination -->
  <line x1="640" y1="143" x2="640" y2="120" stroke="#ef4444" stroke-width="2"/>
  <rect x="628" y="100" width="24" height="20" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="668" y="115" font-size="10" fill="#fca5a5">VTT</text>
  <text x="640" y="230" text-anchor="middle" font-size="9" fill="#86efac">single termination · clean line · per-device skew</text>

  <!-- T-topology -->
  <text x="60" y="290" font-size="13" font-weight="700" fill="#fca5a5">T / STAR (legacy)</text>
  <rect x="40" y="308" width="70" height="46" rx="6" fill="#152238" stroke="#64748b" stroke-width="1.5"/>
  <text x="75" y="336" text-anchor="middle" font-size="11" fill="#e2e8f0">Controller</text>
  <line x1="110" y1="331" x2="330" y2="331" stroke="#64748b" stroke-width="4"/>
  <!-- branch node -->
  <circle cx="330" cy="331" r="4" fill="#f59e0b"/>
  <line x1="330" y1="331" x2="440" y2="300" stroke="#64748b" stroke-width="3"/>
  <line x1="330" y1="331" x2="440" y2="362" stroke="#64748b" stroke-width="3"/>
  <rect x="440" y="285" width="60" height="34" rx="5" fill="#152238" stroke="#64748b" stroke-width="1.5"/>
  <rect x="440" y="345" width="60" height="34" rx="5" fill="#152238" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="306" text-anchor="middle" font-size="10" fill="#cbd5e1">DRAM</text>
  <text x="470" y="366" text-anchor="middle" font-size="10" fill="#cbd5e1">DRAM</text>
  <text x="330" y="352" text-anchor="middle" font-size="9" fill="#fca5a5">branch stubs → reflections at high speed</text>
</svg>
