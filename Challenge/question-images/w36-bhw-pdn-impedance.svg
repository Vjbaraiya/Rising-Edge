<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>
  <text x="360" y="38" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Why One Capacitor Value Isn't Enough</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Each cap has ESL — above self-resonance it goes inductive. Stack values.</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="660" y2="330" stroke="#475569" stroke-width="1.5"/>
  <line x1="90" y1="100" x2="90" y2="330" stroke="#475569" stroke-width="1.5"/>
  <text x="375" y="360" text-anchor="middle" font-size="11" fill="#94a3b8">Frequency →</text>
  <text x="60" y="215" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90 60 215)">|Z| impedance</text>

  <!-- target line -->
  <line x1="90" y1="270" x2="660" y2="270" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="263" font-size="10" fill="#86efac">Z target</text>

  <!-- single cap V-shape (bulk) -->
  <polyline points="110,140 200,290 260,180 340,150 430,150 520,155 620,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="470" y="140" font-size="10" fill="#fca5a5">single value: rises (inductive) → exceeds target</text>

  <!-- composite low curve -->
  <polyline points="110,150 180,285 250,255 320,285 390,255 460,285 530,258 610,285" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="330" y="308" font-size="10" fill="#7dd3fc">bulk + mid + HF ceramics: stays below target</text>

  <!-- self-resonant markers -->
  <g fill="#f59e0b">
    <circle cx="200" cy="290" r="3.5"/><circle cx="330" cy="285" r="3.5"/><circle cx="460" cy="285" r="3.5"/>
  </g>
  <text x="200" y="308" text-anchor="middle" font-size="8" fill="#fbbf24">bulk SRF</text>
  <text x="330" y="272" text-anchor="middle" font-size="8" fill="#fbbf24">mid SRF</text>
  <text x="470" y="272" text-anchor="middle" font-size="8" fill="#fbbf24">HF SRF</text>

  <!-- RLC model -->
  <rect x="120" y="378" width="480" height="30" rx="6" fill="#0b1220" stroke="#1f2a44"/>
  <text x="360" y="398" text-anchor="middle" font-size="11" fill="#cbd5e1">Real capacitor = R (ESR) + L (ESL) + C in series → capacitive, then resonant, then inductive</text>
</svg>
