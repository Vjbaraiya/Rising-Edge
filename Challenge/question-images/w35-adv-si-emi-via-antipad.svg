<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="18" fill="#0f1729" stroke="#1f2a44" stroke-width="1"/>

  <text x="360" y="40" text-anchor="middle" font-size="19" font-weight="800" fill="#f1f5f9">Return Path Discontinuity at a Via Transition</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">Cross-section: an oversized anti-pad forces the return current to detour</text>

  <!-- Top layer trace -->
  <text x="70" y="104" font-size="12" fill="#cbd5e1">TOP LAYER — signal trace</text>
  <line x1="70" y1="120" x2="650" y2="120" stroke="#f59e0b" stroke-width="5"/>

  <!-- Ground plane 1 with anti-pad gap -->
  <text x="70" y="170" font-size="12" fill="#cbd5e1">GROUND PLANE 1 — with oversized anti-pad</text>
  <rect x="70" y="185" width="200" height="10" fill="#22c55e"/>
  <rect x="360" y="185" width="290" height="10" fill="#22c55e"/>
  <rect x="270" y="178" width="90" height="24" rx="4" fill="rgba(239,68,68,0.18)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Inner stripline trace -->
  <text x="70" y="244" font-size="12" fill="#cbd5e1">INNER LAYER — stripline trace</text>
  <line x1="70" y1="260" x2="650" y2="260" stroke="#f59e0b" stroke-width="5"/>

  <!-- Ground plane 2, continuous -->
  <text x="70" y="314" font-size="12" fill="#cbd5e1">GROUND PLANE 2 — continuous reference</text>
  <rect x="70" y="325" width="580" height="10" fill="#22c55e"/>

  <!-- Via -->
  <line x1="315" y1="120" x2="315" y2="260" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="315" cy="120" r="5" fill="#22d3ee"/>
  <circle cx="315" cy="260" r="5" fill="#22d3ee"/>

  <!-- Anti-pad annotation -->
  <text x="395" y="155" font-size="12" fill="#fbbf24">Anti-pad clearance (gap)</text>

  <!-- EMI radiation arcs -->
  <path d="M390,180 Q410,190 390,200" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  <path d="M400,175 Q425,190 400,205" stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M410,170 Q440,190 410,210" stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.45"/>
  <text x="395" y="225" font-size="12" fill="#f87171">EMI: radiates like a slot antenna</text>

  <text x="360" y="395" text-anchor="middle" font-size="11" fill="#64748b">Fix: keep anti-pads no larger than needed, and place ground-stitching vias close to signal-layer transitions.</text>
</svg>
