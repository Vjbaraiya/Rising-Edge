<!doctype html>
<html lang="en" data-theme="">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2385317738136367"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
    <meta
      name="description"
      content="Weekly Hardware Design Challenge — your trophy case, points, tier, streak, badges and rank history."
    />
    <title>Trophy Case | Weekly Hardware Design Challenge</title>
    <link rel="canonical" href="https://www.risingedgetech.com/Challenge/profile.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/themes.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/utilities.css" />
    <link rel="stylesheet" href="challenge.css" />
    <script>
      (function () {
        var t = localStorage.getItem('re-theme') || 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="global-nav"></div>

    <div class="page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../home.html">Home</a><span>/</span> <a href="index.html">Weekly Challenge</a
          ><span>/</span><span>Trophy Case</span>
        </nav>
      </div>
    </div>

    <section class="section" style="padding-top: 1rem">
      <div class="container" style="max-width: 900px">
        <!-- login prompt (shown when signed out) -->
        <div
          id="pLoginPrompt"
          class="wc-panel"
          style="display: none; text-align: center; padding: 2rem 1.5rem; margin-bottom: 1.5rem"
        >
          <div style="font-size: 1.8rem">🏆</div>
          <h2 style="font-size: 1.3rem; margin: 8px 0 6px">Your trophy case</h2>
          <p
            style="color: var(--text-sub); font-size: 0.9rem; max-width: 440px; margin: 0 auto 16px"
          >
            Sign in to track your points, tier, streak, badges, and podium finishes.
          </p>
          <a href="../Login-pages/login.html" class="btn btn-primary">Log in</a>
        </div>

        <!-- profile header -->
        <div class="wc-hero" id="pHeader" style="margin-bottom: 1.5rem; display: none">
          <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
            <div class="wc-avatar" id="pAv" style="width: 74px; height: 74px; font-size: 1.5rem">
              ?
            </div>
            <div style="flex: 1; min-width: 200px">
              <h1 style="font-size: 1.6rem; margin-bottom: 6px" id="pName">—</h1>
              <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
                <span class="wc-tier bronze" id="pTier">★ Bronze</span>
                <span style="font-size: 0.82rem; color: var(--text-muted)" id="pRole"></span>
                <span style="font-size: 0.82rem; color: var(--text-muted)" id="pStreak"></span>
              </div>
            </div>
            <a href="index.html" class="btn btn-secondary">Back to hub</a>
          </div>
          <!-- tier progress -->
          <div style="margin-top: 20px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 0.78rem;
                color: var(--text-sub);
                margin-bottom: 6px;
              "
            >
              <span id="pTierNow">—</span>
              <span id="pTierNext"></span>
            </div>
            <div class="wc-topic-track" style="height: 10px">
              <div class="wc-topic-fill" id="pTierFill" style="width: 0%"></div>
            </div>
            <div
              style="font-size: 0.75rem; color: var(--text-muted); margin-top: 6px"
              id="pTierNote"
            ></div>
          </div>
        </div>

        <!-- stat row -->
        <div class="wc-stat-grid" id="pStats" style="margin-bottom: 1.5rem; display: none">
          <div class="wc-stat">
            <div class="wc-stat-val accent" id="pPoints">—</div>
            <div class="wc-stat-label">Lifetime points</div>
          </div>
          <div class="wc-stat">
            <div class="wc-stat-val" id="pRank">—</div>
            <div class="wc-stat-label">All-time rank</div>
          </div>
          <div class="wc-stat">
            <div class="wc-stat-val" id="pPlayed">—</div>
            <div class="wc-stat-label">Challenges played</div>
          </div>
          <div class="wc-stat">
            <div class="wc-stat-val" id="pStreakStat">—</div>
            <div class="wc-stat-label">Current streak</div>
          </div>
          <div class="wc-stat">
            <div class="wc-stat-val" id="pLongest">—</div>
            <div class="wc-stat-label">Longest streak</div>
          </div>
          <div class="wc-stat">
            <div class="wc-stat-val" id="pPodium">—</div>
            <div class="wc-stat-label">Podium finishes</div>
          </div>
        </div>

        <!-- badges / trophy case -->
        <div class="wc-panel">
          <div class="wc-panel-title">
            Trophy case <span class="badge badge-gray" id="pBadgeCount">0 earned</span>
          </div>
          <div class="wc-badge-grid" id="badgeGrid"></div>
        </div>
      </div>
    </section>

    <div id="global-footer"></div>
    <div id="global-bottom-nav"></div>
    <script src="../assets/js/core.js"></script>
    <script src="challenge-api.js"></script>
    <script>
      // Badge catalog (definitions only). Earned state comes from the API.
      // Names must match the `name` column in the server's badges table.
      var badges = [
        { i: '🎯', n: 'First Challenge', d: 'Completed your first weekly' },
        { i: '🔹', n: '5 Challenges', d: 'Completed 5 weekly challenges' },
        { i: '🔷', n: '10 Challenges', d: 'Completed 10 weekly challenges' },
        { i: '💠', n: '25 Challenges', d: 'Completed 25 weekly challenges' },
        { i: '🌟', n: '50 Challenges', d: 'Completed 50 weekly challenges' },
        { i: '🔥', n: '5-Week Streak', d: 'Five weeks in a row' },
        { i: '🏅', n: '10-Week Streak', d: 'Ten weeks in a row' },
        { i: '🏆', n: 'Iron Engineer', d: 'Twenty-five weeks in a row' },
        { i: '🥇', n: 'Champion', d: 'Finished #1 in a week' },
        { i: '🥉', n: 'Podium', d: 'Top-3 finish' },
        { i: '💯', n: 'Perfect Score', d: '100% in a challenge' },
        { i: '⚡', n: 'Early Bird', d: 'Submitted in first 24h' },
        { i: '👑', n: 'Grandmaster', d: 'Reach Platinum tier' },
      ];
      function renderBadges(earnedNames) {
        earnedNames = earnedNames || [];
        document.getElementById('badgeGrid').innerHTML = badges
          .map(function (b) {
            var earned = earnedNames.indexOf(b.n) !== -1;
            return (
              '<div class="wc-badge' +
              (earned ? '' : ' locked') +
              '">' +
              '<div class="wc-badge-ico">' +
              b.i +
              '</div>' +
              '<div class="wc-badge-name">' +
              b.n +
              '</div>' +
              '<div class="wc-badge-desc">' +
              b.d +
              '</div></div>'
            );
          })
          .join('');
        document.getElementById('pBadgeCount').textContent = earnedNames.length + ' earned';
      }

      function initials(name) {
        return (name || '?')
          .split(/\s+/)
          .map(function (w) {
            return w[0] || '';
          })
          .join('')
          .slice(0, 2)
          .toUpperCase();
      }

      var TIERS = [
        { name: 'Bronze', cls: 'bronze', min: 0, next: 1500 },
        { name: 'Silver', cls: 'silver', min: 1500, next: 3000 },
        { name: 'Gold', cls: 'gold', min: 3000, next: 6000 },
        { name: 'Platinum', cls: 'platinum', min: 6000, next: null },
      ];

      function showSignedOut() {
        document.getElementById('pLoginPrompt').style.display = 'block';
        document.getElementById('pHeader').style.display = 'none';
        document.getElementById('pStats').style.display = 'none';
        renderBadges([]);
      }

      (function () {
        if (!window.WHDC || !WHDC.loggedIn()) {
          showSignedOut();
          return;
        }
        var user = {};
        try {
          user = JSON.parse(localStorage.getItem('re_user') || '{}');
        } catch (e) {}

        WHDC.me()
          .then(function (me) {
            if (!me || !me.points) {
              showSignedOut();
              return;
            }
            var p = me.points;
            document.getElementById('pHeader').style.display = 'block';
            document.getElementById('pStats').style.display = 'grid';
            document.getElementById('pLoginPrompt').style.display = 'none';

            var name = user.fullName || user.full_name || 'Member';
            document.getElementById('pName').textContent = name;
            document.getElementById('pAv').textContent = initials(name);
            document.getElementById('pRole').textContent =
              user.current_role || user.currentRole || '';
            document.getElementById('pStreak').textContent = p.current_streak
              ? '· 🔥 ' + p.current_streak + '-week streak'
              : '';

            var tierObj =
              TIERS.filter(function (t) {
                return t.name === p.tier;
              })[0] || TIERS[0];
            var tierEl = document.getElementById('pTier');
            tierEl.className = 'wc-tier ' + tierObj.cls;
            tierEl.textContent = '★ ' + tierObj.name;

            var pts = Number(p.lifetime_points || 0);
            document.getElementById('pTierNow').textContent =
              tierObj.name + ' · ' + pts.toLocaleString('en-US') + ' pts';
            if (tierObj.next) {
              var span = tierObj.next - tierObj.min;
              var into = pts - tierObj.min;
              var pct = Math.max(0, Math.min(100, Math.round((into / span) * 100)));
              document.getElementById('pTierFill').style.width = pct + '%';
              document.getElementById('pTierNext').textContent =
                'Next tier at ' + tierObj.next.toLocaleString('en-US') + ' pts';
              document.getElementById('pTierNote').textContent =
                (tierObj.next - pts).toLocaleString('en-US') + ' points to the next tier.';
            } else {
              document.getElementById('pTierFill').style.width = '100%';
              document.getElementById('pTierNext').textContent = 'Top tier reached';
              document.getElementById('pTierNote').textContent = 'You’ve reached the highest tier.';
            }

            document.getElementById('pPoints').textContent = pts.toLocaleString('en-US');
            document.getElementById('pRank').textContent = '#' + (me.allTimeRank || '—');
            document.getElementById('pPlayed').textContent = p.challenges_played || 0;
            document.getElementById('pStreakStat').textContent = '🔥 ' + (p.current_streak || 0);
            document.getElementById('pLongest').textContent = p.longest_streak || 0;
            document.getElementById('pPodium').textContent = p.podium_finishes || 0;

            renderBadges(
              (me.badges || []).map(function (b) {
                return b.name;
              })
            );
          })
          .catch(function () {
            showSignedOut();
          });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
